name: Build Beta 13 package
on:
  push:
    branches:
      - beta/fix-reviewed-ro-resurfacing-20261010
permissions:
  contents: write
jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[beta13-package]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Build package
        run: |
          python3 scripts/build_beta13.py
          git add updates/manifest.json updates/packages/moondog-0.10.18-beta.13.json
          git -c user.name='MoonDog CI' -c user.email='ci@users.noreply.github.com' commit -m '[beta13-package] Candidate'
          git push
