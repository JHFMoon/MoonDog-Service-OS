name: Verified Issue Closure

on:
  workflow_run:
    workflows: ["Publication check"]
    types: [completed]
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Verify without closing eligible issues'
        required: false
        type: boolean
        default: false

# Protected PR and CI gates remain in place. This workflow only acts on
# evidence already merged onto trusted main. No PR/issue text is executed.
permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: write

concurrency:
  group: moondog-verified-issue-closeout
  cancel-in-progress: false

jobs:
  close-complete-issues:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       (github.event.workflow_run.event == 'push' ||
        github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read only trusted current main source
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: Verify issue completion independently and close only if eligible
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
        run: python3 scripts/issue_auto_close.py
