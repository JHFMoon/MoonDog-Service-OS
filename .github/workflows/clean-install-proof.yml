name: Clean Install Proof

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove-clean-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 2  # Keep PR merge parent for package-only source-parity proof

      - name: Fail fast until trusted Beta package matches runtime
        if: github.event_name == 'pull_request'
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/preflight_beta_runtime.py

      - name: Classify exact pull request change scope
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          metadata_only=false
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]] && git rev-parse --verify "${GITHUB_SHA}^2" >/dev/null 2>&1; then
            diff_file="$(mktemp)"
            git diff --no-renames --name-only -z "${GITHUB_SHA}^1" "${GITHUB_SHA}^2" > "$diff_file"
            mapfile -d '' changed_paths < "$diff_file"
            rm -f "$diff_file"
            if ((${#changed_paths[@]})); then
              manifest_dir="$(mktemp -d)"
              trap 'rm -rf "$manifest_dir"' EXIT
              git show "${GITHUB_SHA}^1:updates/manifest.json" > "$manifest_dir/base.json"
              git show "${GITHUB_SHA}^2:updates/manifest.json" > "$manifest_dir/head.json"
              change_scope="$(python3 scripts/beta_change_scope.py --base-manifest "$manifest_dir/base.json" --head-manifest "$manifest_dir/head.json" "${changed_paths[@]}")"
              [[ "$change_scope" == "metadata-only" ]] && metadata_only=true
            fi
          fi
          echo "metadata_only=$metadata_only" >> "$GITHUB_OUTPUT"
          echo "Beta clean-install scope: $([[ "$metadata_only" == true ]] && echo metadata-only || echo full-runtime)"

      - name: Recreate and verify pinned browser dependencies
        run: bash scripts/prepare_distribution_vendor.sh .distribution-vendor

      - name: Build twice and prove deterministic output
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist .clean-install-smoke
          mkdir -p dist .clean-install-smoke
          python3 scripts/build_distribution.py --vendor-dir .distribution-vendor --output dist/Service-Operations-Dashboard.zip
          python3 scripts/build_distribution.py --vendor-dir .distribution-vendor --output dist/reproducibility-check.zip
          cmp dist/Service-Operations-Dashboard.zip dist/reproducibility-check.zip
          (cd dist && sha256sum --check Service-Operations-Dashboard.zip.sha256)
          unzip -q dist/Service-Operations-Dashboard.zip -d .clean-install-smoke

      - name: Install browser smoke-test dependency
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Smoke-test extracted file application
        run: |
          node scripts/smoke_distribution.mjs ".clean-install-smoke/Service Operations Dashboard/00 - OPEN DASHBOARD.html"
      - name: Prove 16:9 TV layouts and seven-slide rotation with synthetic data
        if: steps.scope.outputs.metadata_only != 'true'
        run: |
          node scripts/smoke_overdrive.mjs ".clean-install-smoke/Service Operations Dashboard/00 - OPEN DASHBOARD.html" ".clean-install-smoke/overdrive-proof"

      - name: Install the verified Beta package and launch its runtime
        run: |
          node scripts/smoke_beta_package.mjs ".clean-install-smoke/Service Operations Dashboard/00 - OPEN DASHBOARD.html"

      - name: Verify package/runtime integrity when reusing the UX proof
        if: steps.scope.outputs.metadata_only == 'true'
        run: python3 -m unittest discover -s tests -p 'test_beta_package_runtime.py'

      - name: Verify synthetic navigation benchmark structure
        if: steps.scope.outputs.metadata_only != 'true'
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path(".clean-install-smoke/overdrive-proof/navigation-baseline.json")
          report=json.loads(p.read_text(encoding="utf-8"))
          assert set(report)=={"schemaVersion","dataset","viewport","startupMs","navigationMs","responsiveness","managerHomeDom"}
          assert report["schemaVersion"]==1 and report["dataset"]=="synthetic-clean-install"
          assert report["viewport"]=={"width":1600,"height":900}
          startup=report["startupMs"]
          assert set(startup)=={"launcherToShellAttached"}
          assert isinstance(startup["launcherToShellAttached"],(int,float)) and 0<=startup["launcherToShellAttached"]<120000
          nav=report["navigationMs"]
          assert set(nav)=={"count","p50","p95","max"}
          assert nav["count"]==36 and 0<=nav["p50"]<=nav["p95"]<=nav["max"]
          if report["responsiveness"] is not None:
              assert set(report["responsiveness"])=={"longTasks","maxLongTaskMs"}
              assert all(isinstance(v,(int,float)) and v>=0 for v in report["responsiveness"].values())
          home=report["managerHomeDom"]
          assert set(home)=={"dataset","scope","rowCount","sampleCount","viewport","p50Ms","p95Ms","maxMs"}
          assert home["dataset"]=="synthetic-in-memory-manager-home"
          assert home["rowCount"]==413 and home["sampleCount"]==9
          assert home["viewport"]==report["viewport"]
          assert 0<=home["p50Ms"]<=home["p95Ms"]<=home["maxMs"]
          assert p.stat().st_size<4096
          print("PASS: synthetic-only navigation timing artifact validated")

          retry_path=Path(".clean-install-smoke/overdrive-proof/ux-retry-diagnostics.json")
          retry=json.loads(retry_path.read_text(encoding="utf-8"))
          assert set(retry)=={"schemaVersion","dataset","maxAttempts","retries"}
          assert retry["schemaVersion"]==1 and retry["dataset"]=="synthetic-clean-install"
          assert retry["maxAttempts"]==2 and isinstance(retry["retries"],list)
          for item in retry["retries"]:
              assert item["scenario"] in {"empty","large","large-slow-read"}
              assert 1<=item["sample"]<=9 and item["finalOutcome"]=="passed"
              assert len(item["attempts"])==2
              assert [attempt["attempt"] for attempt in item["attempts"]]==[1,2]
              assert item["attempts"][0]["outcome"]=="failed"
              assert item["attempts"][1]["outcome"]=="passed"
              trace=item["attempts"][0]["tracePath"]
              assert isinstance(trace,str) and trace.startswith("ux-retry-traces/")
              assert retry_path.parent.joinpath(trace.removeprefix("")).is_file()
              assert isinstance(item["attempts"][0]["reason"],str) and item["attempts"][0]["reason"]
          print("PASS: bounded synthetic UX retries retain sanitized reasons and Playwright traces")

          ux_path=Path(".clean-install-smoke/overdrive-proof/open-ro-workflow-metrics.json")
          ux=json.loads(ux_path.read_text(encoding="utf-8"))
          assert set(ux)=={"schemaVersion","dataset","scenario","records","attemptedSamples","completedSamples","failedSamples","errorRate","taskDurationMs","clickCount","fieldEntryCount","scrollDistancePx","browserErrorCount","interruptedSaveTask","reconnectTask","sampleResults"}
          assert ux["schemaVersion"]==1 and ux["dataset"]=="synthetic-clean-install"
          assert ux["records"]==2100 and ux["attemptedSamples"]==9 and ux["completedSamples"]==9
          assert ux["failedSamples"]==0 and ux["errorRate"]==0 and ux["browserErrorCount"]==0
          assert len(ux["sampleResults"])==9
          assert [sample["sample"] for sample in ux["sampleResults"]]==list(range(1,10))
          assert all(sample["success"] is True for sample in ux["sampleResults"])
          assert all(1<=sample.get("attemptCount",1)<=2 for sample in ux["sampleResults"])
          for key in ("taskDurationMs","clickCount","fieldEntryCount","scrollDistancePx"):
              metric=ux[key]
              assert set(metric)=={"count","p50","p95","max"} and metric["count"]==9
              assert 0<=metric["p50"]<=metric["p95"]<=metric["max"]
          assert ux["clickCount"]["p50"]==4 and ux["clickCount"]["max"]==4
          assert ux["fieldEntryCount"]["p50"]>=5
          # The same nine packaged file:// browser journeys must prove both
          # pre-write fault recovery and a newly committed folder reconnect.
          # Requiring all named nested measurements is stricter than accepting
          # the previous success-only summary schema.
          for name in ("interruptedSaveTask","reconnectTask"):
              task=ux[name]
              assert set(task)=={"scenario","samples","elapsedMs","clickCount","fieldEntryCount","scrollDistancePx","verifiedReadbacks"}
              assert isinstance(task["scenario"],str) and task["scenario"].strip()
              assert task["samples"]==9 and task["verifiedReadbacks"]==9
              for key in ("elapsedMs","clickCount","fieldEntryCount","scrollDistancePx"):
                  metric=task[key]
                  assert set(metric)=={"count","p50","p95","max"} and metric["count"]==9
                  assert 0<=metric["p50"]<=metric["p95"]<=metric["max"]
              assert task["clickCount"]["p50"]>=1
          assert ux["interruptedSaveTask"]["fieldEntryCount"]["p50"]>=2
          assert all(
              sample["interruptedSaveTask"]["verifiedReadback"] is True and
              sample["interruptedSaveTask"]["unsavedDraftPreserved"] is True and
              sample["interruptedSaveTask"]["expectedWriteFailures"]==1 and
              sample["reconnectTask"]["verifiedReadback"] is True and
              sample["reconnectTask"]["restoredManagerState"] is True
              for sample in ux["sampleResults"]
          )
          # Expanded proof contains two extra measured sub-journeys per sample;
          # retain a bounded, synthetic-only artifact size guard.
          assert ux_path.stat().st_size<20000
          print("PASS: nine complete Open RO save, pre-write failure/retry and reconnect measurements validated")

          matrix_path=Path(".clean-install-smoke/overdrive-proof/responsive-ux-matrix.json")
          matrix=json.loads(matrix_path.read_text(encoding="utf-8"))
          assert set(matrix)=={"schemaVersion","dataset","scope","routes","standardViewportCount","standardRouteSampleCount","zoomEquivalentViewportCount","zoomEquivalentRouteSampleCount","routeResults","zoomEquivalentResults","longTextResults","keyboardFocus","keyboardRouteResults","screenTaskEffort","openRoTaskEffort","failures"}
          assert matrix["schemaVersion"]==1 and matrix["dataset"]=="synthetic-clean-install"
          assert matrix["standardViewportCount"]==10 and matrix["standardRouteSampleCount"]==100
          assert matrix["zoomEquivalentViewportCount"]==4 and matrix["zoomEquivalentRouteSampleCount"]==12
          assert matrix["routes"]==["overview","tools","arrivals","assign-next","performance","meeting","open-ro","imports","settings","home"]
          assert len(matrix["routeResults"])==100 and len(matrix["zoomEquivalentResults"])==12
          assert not matrix["failures"]
          assert len(matrix["keyboardRouteResults"])==10
          assert all(item["view"] in matrix["routes"] and item["inActiveRoute"] and item["accessibleName"] and item["visible"] and item["keyboardFocusVisible"] and item["focusIndicator"] for item in matrix["keyboardRouteResults"])
          task_names=["manager-home-priority","assign-next-review-and-exclude","performance-report-readiness","imports-refresh-and-empty-state","meeting-source-readiness","settings-browser-preference"]
          assert [task["name"] for task in matrix["screenTaskEffort"]]==task_names
          for task in matrix["screenTaskEffort"]:
              assert task["attemptedSamples"]==9 and task["completedSamples"]==9 and task["failedSamples"]==0
              assert len(task["sampleResults"])==9 and all(sample["success"] for sample in task["sampleResults"])
              for key in ("taskDurationMs","clickCount","fieldEntryCount","scrollDistancePx"):
                  metric=task[key]
                  assert set(metric)=={"count","p50","p95","max"} and metric["count"]==9
                  assert 0<=metric["p50"]<=metric["p95"]<=metric["max"]
          assert matrix["screenTaskEffort"][1]["clickCount"]["p50"]>=2
          assert matrix["screenTaskEffort"][3]["clickCount"]["p50"]>=2
          assert matrix["screenTaskEffort"][5]["fieldEntryCount"]["p50"]>=1
          assert all(item["contrast"]["sampleCount"]>0 and item["contrast"]["unmeasuredCount"]==0 and item["contrast"]["lowContrastCount"]==0 for item in matrix["routeResults"]+matrix["zoomEquivalentResults"])
          all_routes=matrix["routeResults"]+matrix["zoomEquivalentResults"]
          assert all(item["active"] and item["documentHorizontalOverflowPx"]<=4 and item["viewRightOverflowPx"]<=4 and item["unnamedControlCount"]==0 for item in all_routes)
          assert len(matrix["longTextResults"])==14
          assert all(item["rowFound"] and item["visibleFields"]==3 and item["clippedFields"]==0 and len(item["fields"])==3 for item in matrix["longTextResults"])
          assert all(field["present"] and field["visible"] and not field["clipped"] for item in matrix["longTextResults"] for field in item["fields"])
          focus=matrix["keyboardFocus"]
          assert focus["visible"] and focus["keyboardFocusVisible"] and focus["focusIndicator"]
          effort=matrix["openRoTaskEffort"]
          assert effort["attemptedSamples"]==9 and effort["completedSamples"]==9 and effort["failedSamples"]==0
          for key in ("taskDurationMs","clickCount","fieldEntryCount","scrollDistancePx"):
              metric=effort[key]
              assert set(metric)=={"count","p50","p95","max"} and metric["count"]==9
              assert 0<=metric["p50"]<=metric["p95"]<=metric["max"]
          assert effort["clickCount"]["p50"]==4 and effort["clickCount"]["max"]==4
          assert effort["fieldEntryCount"]["p50"]>=5
          assert matrix_path.stat().st_size<200000
          print("PASS: 100 screen/viewport routes, 12 zoom-equivalent routes, route keyboard focus, contrast, long text, nine Open RO tasks, and 54 measured screen tasks validated")
          PY

      - name: Upload proof artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: clean-install-proof
          path: |
            dist/Service-Operations-Dashboard.zip
            dist/Service-Operations-Dashboard.zip.sha256
            dist/Service-Operations-Dashboard.manifest.json
            .clean-install-smoke/overdrive-proof/navigation-baseline.json
            .clean-install-smoke/overdrive-proof/open-ro-workflow-metrics.json
            .clean-install-smoke/overdrive-proof/responsive-ux-matrix.json
            .clean-install-smoke/overdrive-proof/ux-retry-diagnostics.json
            .clean-install-smoke/overdrive-proof/ux-retry-traces/*.zip
          if-no-files-found: error
          retention-days: 7
