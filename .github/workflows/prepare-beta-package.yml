name: Prepare Beta Package

on:
  workflow_dispatch:
    inputs:
      reviewed_commit:
        description: 'Merged runtime commit to backfill (full SHA)'
        required: true
        type: string
  push:
    branches: [main]
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

# Generated package commits explicitly dispatch their own verification because
# GitHub marks pull-request runs authored by github-actions[bot] as action_required.
permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

# The trusted packaging import must not create untracked scripts/__pycache__ files.
# Otherwise the guarded changed-file allowlist blocks valid Beta publication.
env:
  PYTHONDONTWRITEBYTECODE: '1'

concurrency:
  group: prepare-beta-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.body, 'MoonDog-Auto-Merge: yes') &&
      (github.event.pull_request.author_association == 'OWNER' ||
       github.event.pull_request.author_association == 'MEMBER' ||
       github.event.pull_request.author_association == 'COLLABORATOR')
    runs-on: ubuntu-latest
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
      PR_TITLE: ${{ github.event.pull_request.title }}

    steps:
      - name: Check out trusted packaging logic from the reviewed base
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          fetch-depth: 1

      - name: Check out candidate without executing candidate code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0

      - name: Refuse automatic changes to trusted proof/automation files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/${{ github.repository }}/pulls/$PR_NUMBER/files?per_page=100"             --jq '.[].filename' > /tmp/pr-paths.txt
          python3 trusted/scripts/pipeline_guard.py check-paths /tmp/pr-paths.txt

      - name: Prepare next Beta only when reviewed runtime changed
        shell: bash
        run: |
          set -euo pipefail
          python3 trusted/scripts/build_beta_package.py --root candidate --base-root trusted --base-manifest trusted/updates/manifest.json --release-notes "$PR_TITLE. Verified automated Beta; no Workspace migration."

      - name: Commit generated Beta package back to the same PR branch
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          if git diff --quiet -- CHANGELOG.md README.md updates/manifest.json updates/packages && [ -z "$(git ls-files --others --exclude-standard updates/packages)" ]; then
            echo "Reviewed runtime already matches the advertised Beta package."
            echo "generated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED="$(git status --porcelain)"
          if echo "$CHANGED" | grep -Ev '^( M|M |A |\?\?) (CHANGELOG\.md|README\.md|updates/manifest\.json|updates/packages/moondog-[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+\.json)$' | grep -q .; then
            echo "Beta preparation attempted an unexpected file change:" >&2
            echo "$CHANGED" >&2
            exit 1
          fi
          git config user.name "MoonDog Automation"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md README.md updates/manifest.json updates/packages
          git commit -m "Package next verified Beta"
          git push origin "HEAD:$HEAD_BRANCH"
          echo "generated=true" >> "$GITHUB_OUTPUT"

      - name: Dispatch required checks for automation-generated head
        if: steps.commit.outputs.generated == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run publication-check.yml --repo "${{ github.repository }}" --ref "$HEAD_BRANCH"
          gh workflow run clean-install-proof.yml --repo "${{ github.repository }}" --ref "$HEAD_BRANCH"

      - name: Wait for generated-head proof and merge
        if: steps.commit.outputs.generated == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          CURRENT_HEAD="$(git -C candidate rev-parse HEAD)"
          export CURRENT_HEAD
          for attempt in {1..42}; do
            RUNS="$(gh api "repos/$REPO/actions/runs?head_sha=$CURRENT_HEAD&per_page=50")"
            PUB_OK="$(jq '[.workflow_runs[] | select(.name=="Publication check" and .conclusion=="success")] | length' <<<"$RUNS")"
            CLEAN_OK="$(jq '[.workflow_runs[] | select(.name=="Clean Install Proof" and .conclusion=="success")] | length' <<<"$RUNS")"
            PENDING="$(jq '[.workflow_runs[] | select((.name=="Publication check" or .name=="Clean Install Proof") and .status!="completed")] | length' <<<"$RUNS")"
            HARD_FAIL="$(jq '[.workflow_runs[] | select((.name=="Publication check" or .name=="Clean Install Proof") and (.conclusion=="failure" or .conclusion=="cancelled" or .conclusion=="timed_out"))] | length' <<<"$RUNS")"
            if [ "$HARD_FAIL" != "0" ]; then
              echo "Generated-head verification failed; failed run IDs and job names:" >&2
              jq -r '.workflow_runs[] | select((.name=="Publication check" or .name=="Clean Install Proof") and (.conclusion=="failure" or .conclusion=="cancelled" or .conclusion=="timed_out")) | [.name, (.id|tostring), .conclusion] | @tsv' <<<"$RUNS" >&2
              exit 1
            fi
            if [ "$PENDING" = "0" ] && [ "$PUB_OK" != "0" ] && [ "$CLEAN_OK" != "0" ]; then
              break
            fi
            if [ "$attempt" = "42" ]; then
              echo "Timed out waiting for all generated-head checks to settle." >&2
              exit 1
            fi
            sleep 10
          done

          PUB_RUN_ID="$(jq -r '[.workflow_runs[] | select(.name=="Publication check" and .conclusion=="success")][0].id // empty' <<<"$RUNS")"
          test -n "$PUB_RUN_ID" || {
            echo "Could not identify the successful Publication Check run." >&2
            exit 1
          }
          gh api -X POST "repos/$REPO/statuses/$CURRENT_HEAD"             -f state=success             -f context="Publication Check"             -f description="Exact-head Publication Check and Clean Install Proof passed"             -f target_url="https://github.com/$REPO/actions/runs/$PUB_RUN_ID"

          gh api "repos/$REPO/pulls/$PR_NUMBER" > /tmp/generated-pr.json
          python3 - <<'PY'
          import json, os
          pr=json.load(open('/tmp/generated-pr.json',encoding='utf-8'))
          checks={
              'open': pr.get('state')=='open',
              'draft': pr.get('draft') is False,
              'base': pr.get('base',{}).get('ref')=='main',
              'same_repo': pr.get('head',{}).get('repo',{}).get('full_name')==os.environ['REPO'],
              'head': pr.get('head',{}).get('sha')==os.environ['CURRENT_HEAD'],
              'authorization': 'MoonDog-Auto-Merge: yes' in (pr.get('body') or ''),
              'association': pr.get('author_association') in {'OWNER','MEMBER','COLLABORATOR'},
          }
          failed=[name for name,ok in checks.items() if not ok]
          if failed:
              raise SystemExit('Generated-head merge refused: '+', '.join(failed))
          PY

          STATUS="$(gh api "repos/$REPO/compare/main...$CURRENT_HEAD" --jq .status)"
          test "$STATUS" = "ahead" || {
            echo "Main advanced while the Beta was verifying; refusing a stale merge." >&2
            exit 1
          }

          MAIN_SHA="$(gh api "repos/$REPO/branches/main" --jq .commit.sha)"
          gh api -H "Accept: application/vnd.github.raw+json"             "repos/$REPO/contents/updates/manifest.json?ref=$MAIN_SHA" > /tmp/main-manifest.json
          gh api -H "Accept: application/vnd.github.raw+json"             "repos/$REPO/contents/updates/manifest.json?ref=$CURRENT_HEAD" > /tmp/head-manifest.json
          python3 - <<'PY'
          import json
          main=json.load(open('/tmp/main-manifest.json',encoding='utf-8'))
          head=json.load(open('/tmp/head-manifest.json',encoding='utf-8'))
          if main.get('stable') != head.get('stable'):
              raise SystemExit('Generated-head merge refused: Stable changed.')
          PY

          for attempt in {1..12}; do
            if RESULT="$(gh api -X PUT "repos/$REPO/pulls/$PR_NUMBER/merge" -f merge_method=squash -f sha="$CURRENT_HEAD" 2>&1)"; then
              jq '{merged:.merged,message:.message,sha:.sha}' <<<"$RESULT"
              test "$(jq -r '.merged' <<<"$RESULT")" = "true"
              MERGED_SHA="$(jq -r '.sha' <<<"$RESULT")"
              for settle in {1..12}; do
                MAIN_SHA="$(gh api "repos/$REPO/branches/main" --jq .commit.sha)"
                [ "$MAIN_SHA" = "$MERGED_SHA" ] && break
                sleep 2
              done
              test "$MAIN_SHA" = "$MERGED_SHA" || {
                echo "Merged commit did not become current main; refusing post-merge proof." >&2
                exit 1
              }
              gh workflow run publication-check.yml --repo "$REPO" --ref main
              exit 0
            fi
            if grep -Eq 'Required status check.*(in progress|expected)' <<<"$RESULT"; then
              sleep 5
              continue
            fi
            echo "$RESULT" >&2
            exit 1
          done
          echo "GitHub did not settle the generated-head status context in time." >&2
          exit 1

  package-unadvertised-main-runtime:
    if: (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out current main with enough history
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Detect merged runtime that is not already packaged
        id: detect
        shell: bash
        env:
          REQUESTED_COMMIT: ${{ inputs.reviewed_commit || '' }}
        run: |
          set -euo pipefail
          git fetch origin main
          MAIN_SHA="$(git rev-parse origin/main)"
          test "$(git rev-parse HEAD)" = "$MAIN_SHA" || {
            echo "Main moved before packaging; a later push will retry." >&2
            exit 1
          }
          TARGET_SHA="${REQUESTED_COMMIT:-$MAIN_SHA}"
          git cat-file -e "$TARGET_SHA^{commit}"
          git merge-base --is-ancestor "$TARGET_SHA" "$MAIN_SHA" || {
            echo "Requested commit is not contained in current main." >&2
            exit 1
          }
          TARGET_PARENT="$(git rev-parse "$TARGET_SHA^")"
          git diff --name-only "$TARGET_PARENT" "$TARGET_SHA" > /tmp/merged-paths.txt

          python3 - <<'PY' > /tmp/runtime-detect.json
          import json
          from pathlib import Path
          from scripts.build_beta_package import beta_runtime_paths
          changed={line.strip() for line in Path('/tmp/merged-paths.txt').read_text(encoding='utf-8').splitlines() if line.strip()}
          paths=set(beta_runtime_paths(Path('assets/app.js').read_text(encoding='utf-8')))
          runtime=sorted(changed & paths)
          package_changed=(
              'updates/manifest.json' in changed
              and any(p.startswith('updates/packages/moondog-') and p.endswith('.json') for p in changed)
          )
          print(json.dumps({'runtime':runtime,'packageChanged':package_changed}))
          PY

          RUNTIME_COUNT="$(python3 -c 'import json; print(len(json.load(open("/tmp/runtime-detect.json"))["runtime"]))')"
          PACKAGE_CHANGED="$(python3 -c 'import json; print(str(json.load(open("/tmp/runtime-detect.json"))["packageChanged"]).lower())')"
          if [ "$RUNTIME_COUNT" = "0" ]; then
            echo "No merged browser runtime change; no Beta publication needed."
            echo "needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$PACKAGE_CHANGED" = "true" ]; then
            echo "Merged runtime commit already carries a Beta package."
            echo "needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "needed=true" >> "$GITHUB_OUTPUT"
          echo "main_sha=$MAIN_SHA" >> "$GITHUB_OUTPUT"
          echo "target_parent=$TARGET_PARENT" >> "$GITHUB_OUTPUT"

      - name: Build next Beta from trusted current main
        id: build
        if: steps.detect.outputs.needed == 'true'
        shell: bash
        env:
          BASE_SHA: ${{ steps.detect.outputs.target_parent }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/moondog-beta-base
          git archive "$BASE_SHA" | tar -x -C /tmp/moondog-beta-base
          cp updates/manifest.json /tmp/moondog-beta-base-manifest.json
          python3 scripts/build_beta_package.py             --root .             --base-root /tmp/moondog-beta-base             --base-manifest /tmp/moondog-beta-base-manifest.json             --release-notes "Automatically packaged merged runtime from current main; Stable unchanged."

          CHANGED="$(git status --porcelain)"
          if echo "$CHANGED" | grep -Ev '^( M|M |A |\?\?) (CHANGELOG\.md|README\.md|updates/manifest\.json|updates/packages/moondog-[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+\.json)$' | grep -q .; then
            echo "Post-merge Beta preparation attempted an unexpected file change:" >&2
            echo "$CHANGED" >&2
            exit 1
          fi
          test -n "$(git status --porcelain -- CHANGELOG.md README.md updates/manifest.json updates/packages)" || {
            echo "Runtime delta produced no Beta package; refusing silent success." >&2
            exit 1
          }

          BRANCH="beta/post-merge-$GITHUB_RUN_ID"
          git switch -c "$BRANCH"
          git config user.name "MoonDog Automation"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md README.md updates/manifest.json updates/packages
          git commit -m "Package merged runtime into next verified Beta"
          git push origin "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Open isolated package PR
        id: pr
        if: steps.detect.outputs.needed == 'true'
        shell: bash
        env:
          BRANCH: ${{ steps.build.outputs.branch }}
        run: |
          set -euo pipefail
          URL="$(gh pr create             --base main             --head "$BRANCH"             --title "Package merged runtime into next Beta"             --body "MoonDog-Automation-Package: yes

          Generated from already-merged runtime using the trusted Beta builder. Only Beta metadata/package files may change. Stable must remain unchanged. Required exact-head Publication Check and Clean Install Proof must pass before merge.")"
          PR_NUMBER="$(gh pr view "$URL" --json number --jq .number)"
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Dispatch exact-head verification
        if: steps.detect.outputs.needed == 'true'
        shell: bash
        env:
          BRANCH: ${{ steps.build.outputs.branch }}
        run: |
          set -euo pipefail
          gh workflow run publication-check.yml --repo "$REPO" --ref "$BRANCH"
          gh workflow run clean-install-proof.yml --repo "$REPO" --ref "$BRANCH"

      - name: Verify package PR and merge exact head
        if: steps.detect.outputs.needed == 'true'
        shell: bash
        env:
          BRANCH: ${{ steps.build.outputs.branch }}
          PACKAGE_HEAD: ${{ steps.build.outputs.head_sha }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          EXPECTED_MAIN: ${{ steps.detect.outputs.main_sha }}
        run: |
          set -euo pipefail
          for attempt in {1..42}; do
            RUNS="$(gh api "repos/$REPO/actions/runs?head_sha=$PACKAGE_HEAD&per_page=100")"
            PUB_OK="$(jq '[.workflow_runs[] | select(.name=="Publication check" and .event=="workflow_dispatch" and .conclusion=="success")] | length' <<<"$RUNS")"
            CLEAN_OK="$(jq '[.workflow_runs[] | select(.name=="Clean Install Proof" and .event=="workflow_dispatch" and .conclusion=="success")] | length' <<<"$RUNS")"
            PENDING="$(jq '[.workflow_runs[] | select((.name=="Publication check" or .name=="Clean Install Proof") and .event=="workflow_dispatch" and .status!="completed")] | length' <<<"$RUNS")"
            HARD_FAIL="$(jq '[.workflow_runs[] | select((.name=="Publication check" or .name=="Clean Install Proof") and .event=="workflow_dispatch" and (.conclusion=="failure" or .conclusion=="cancelled" or .conclusion=="timed_out"))] | length' <<<"$RUNS")"
            if [ "$HARD_FAIL" != "0" ]; then
              echo "Generated Beta verification failed. Exact-head workflow IDs and failed jobs follow." >&2
              FAILED_IDS="$(jq -r '.workflow_runs[] | select((.name=="Publication check" or .name=="Clean Install Proof") and .event=="workflow_dispatch" and (.conclusion=="failure" or .conclusion=="cancelled" or .conclusion=="timed_out")) | .id' <<<"$RUNS")"
              while IFS= read -r FAILED_ID; do
                [ -n "$FAILED_ID" ] || continue
                echo "Failed verification: https://github.com/$REPO/actions/runs/$FAILED_ID" >&2
                gh api "repos/$REPO/actions/runs/$FAILED_ID/jobs?per_page=100" \
                  --jq '.jobs[] | select(.conclusion=="failure" or .conclusion=="cancelled" or .conclusion=="timed_out") | [.name, .conclusion, (.id|tostring)] | @tsv' >&2
              done <<<"$FAILED_IDS"
              exit 1
            fi
            if [ "$PENDING" = "0" ] && [ "$PUB_OK" != "0" ] && [ "$CLEAN_OK" != "0" ]; then
              break
            fi
            if [ "$attempt" = "42" ]; then
              echo "Timed out waiting for generated Beta proof." >&2
              exit 1
            fi
            sleep 10
          done

          CURRENT_MAIN="$(gh api "repos/$REPO/branches/main" --jq .commit.sha)"
          test "$CURRENT_MAIN" = "$EXPECTED_MAIN" || {
            echo "Main advanced while generated Beta was verifying; refusing stale merge." >&2
            exit 1
          }

          gh api "repos/$REPO/pulls/$PR_NUMBER" > /tmp/beta-pr.json
          python3 - <<'PY'
          import json, os
          pr=json.load(open('/tmp/beta-pr.json',encoding='utf-8'))
          checks={
              'open': pr.get('state')=='open',
              'draft': pr.get('draft') is False,
              'base': pr.get('base',{}).get('ref')=='main',
              'same_repo': pr.get('head',{}).get('repo',{}).get('full_name')==os.environ['REPO'],
              'head': pr.get('head',{}).get('sha')==os.environ['PACKAGE_HEAD'],
              'machine_marker': 'MoonDog-Automation-Package: yes' in (pr.get('body') or ''),
          }
          failed=[name for name,ok in checks.items() if not ok]
          if failed:
              raise SystemExit('Generated Beta PR refused: '+', '.join(failed))
          PY

          gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files?per_page=100" --jq '.[].filename' > /tmp/beta-paths.txt
          python3 - <<'PY'
          import re
          from pathlib import Path
          allowed={'CHANGELOG.md','README.md','updates/manifest.json'}
          package=re.compile(r'^updates/packages/moondog-[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+\.json$')
          paths=[p.strip() for p in Path('/tmp/beta-paths.txt').read_text().splitlines() if p.strip()]
          bad=[p for p in paths if p not in allowed and not package.fullmatch(p)]
          if bad:
              raise SystemExit('Generated Beta PR contains unexpected paths: '+', '.join(bad))
          PY

          gh api -H "Accept: application/vnd.github.raw+json"             "repos/$REPO/contents/updates/manifest.json?ref=$EXPECTED_MAIN" > /tmp/main-manifest.json
          gh api -H "Accept: application/vnd.github.raw+json"             "repos/$REPO/contents/updates/manifest.json?ref=$PACKAGE_HEAD" > /tmp/package-manifest.json
          python3 - <<'PY'
          import json
          main=json.load(open('/tmp/main-manifest.json',encoding='utf-8'))
          package=json.load(open('/tmp/package-manifest.json',encoding='utf-8'))
          if main.get('stable') != package.get('stable'):
              raise SystemExit('Generated Beta merge refused: Stable changed.')
          if main.get('beta') == package.get('beta'):
              raise SystemExit('Generated Beta merge refused: Beta did not advance.')
          PY

          PUB_RUN_ID="$(jq -r '[.workflow_runs[] | select(.name=="Publication check" and .event=="workflow_dispatch" and .conclusion=="success")][0].id' <<<"$RUNS")"
          gh api -X POST "repos/$REPO/statuses/$PACKAGE_HEAD"             -f state=success             -f context="Publication Check"             -f description="Exact-head Publication Check and Clean Install Proof passed"             -f target_url="https://github.com/$REPO/actions/runs/$PUB_RUN_ID"

          for attempt in {1..12}; do
            if RESULT="$(gh api -X PUT "repos/$REPO/pulls/$PR_NUMBER/merge" -f merge_method=squash -f sha="$PACKAGE_HEAD" 2>&1)"; then
              test "$(jq -r '.merged' <<<"$RESULT")" = "true"
              exit 0
            fi
            if grep -Eq 'Required status check.*(in progress|expected)' <<<"$RESULT"; then
              sleep 5
              continue
            fi
            echo "$RESULT" >&2
            exit 1
          done
          echo "GitHub did not settle required status context for generated Beta." >&2
          exit 1
