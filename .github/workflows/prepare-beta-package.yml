name: Prepare Beta Package

# Build a candidate from trusted packaging logic and attach it to the reviewed
# source PR. pull_request_target is used only with same-repository heads; the
# candidate checkout is data and is never executed.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, edited]
    branches: [main]

permissions:
  contents: read
  issues: read
  pull-requests: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

concurrency:
  group: prepare-beta-package-${{ github.repository }}
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      ((github.event.pull_request.author_association == 'OWNER' ||
        github.event.pull_request.author_association == 'MEMBER' ||
        github.event.pull_request.author_association == 'COLLABORATOR') ||
       github.event.pull_request.user.login == vars.MOONDOG_RELEASE_APP_LOGIN)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      REPO: ${{ github.repository }}

    steps:
      - name: Check out trusted packaging logic from the reviewed base
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false

      - name: Check out candidate as untrusted data
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Verify explicit authorization and protected path boundaries
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$REPO/pulls/$PR_NUMBER" > /tmp/authorized-pr.json
          test "$(jq -r '.head.sha' /tmp/authorized-pr.json)" = "$HEAD_SHA"
          test "$(jq -r '.head.repo.full_name' /tmp/authorized-pr.json)" = "$REPO"
          python3 trusted/scripts/guarded_merge_policy.py check-authorization /tmp/authorized-pr.json --policy trusted/.github/guarded-merge-policy.json
          python3 trusted/scripts/guarded_merge_policy.py check-pr-author /tmp/authorized-pr.json --repository "$REPO" --package-bot-login "${{ vars.MOONDOG_RELEASE_APP_LOGIN }}"
          gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files?per_page=100" --jq '.[].filename' > /tmp/pr-paths.txt
          python3 trusted/scripts/pipeline_guard.py check-paths /tmp/pr-paths.txt

      - name: Defer package generation until PR is based on current main
        id: base
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          MAIN_SHA="$(gh api "repos/$REPO/branches/main" --jq .commit.sha)"
          COMPARE="$(gh api "repos/$REPO/compare/$MAIN_SHA...$HEAD_SHA")"
          STATUS="$(jq -r .status <<<"$COMPARE")"
          MERGE_BASE="$(jq -r '.merge_base_commit.sha // empty' <<<"$COMPARE")"
          if [ "$STATUS" != "ahead" ] || [ "$MERGE_BASE" != "$MAIN_SHA" ]; then
            echo "PR head does not descend from current main; the release queue must additively refresh it before package generation."
            echo "current=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "current=true" >> "$GITHUB_OUTPUT"

      - name: Check whether the candidate runtime needs a Beta package
        id: parity
        if: steps.base.outputs.current == 'true'
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=trusted python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from scripts.build_beta_package import current_beta_runtime_mismatches

          mismatches = current_beta_runtime_mismatches(Path("candidate"))
          needs_package = bool(mismatches)
          print(json.dumps({"needsPackage": needs_package, "runtimeMismatches": mismatches}, sort_keys=True))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("needs_package=" + ("true" if needs_package else "false") + chr(10))
          PY

      - name: Reserve the Beta version for the oldest authorized runtime PR
        id: reservation
        if: steps.base.outputs.current == 'true' && steps.parity.outputs.needs_package == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_BOT_LOGIN: ${{ vars.MOONDOG_RELEASE_APP_LOGIN }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPO/pulls?state=open&per_page=100" --jq '.[]' | jq -s '.' > /tmp/open-prs.json
          PYTHONPATH=trusted python3 - <<'PY'
          import json
          import os
          import subprocess
          from scripts.beta_release_queue import select_next_runtime_pr
          from scripts.guarded_merge_policy import load_policy

          prs = json.load(open("/tmp/open-prs.json", encoding="utf-8"))
          paths_by_pr = {}
          for pr in prs:
              if pr.get("state") != "open" or pr.get("draft") is not False:
                  continue
              number = pr.get("number")
              if not isinstance(number, int):
                  continue
              result = subprocess.run(
                  ["gh", "api", "--paginate",
                   f"repos/{os.environ['REPO']}/pulls/{number}/files?per_page=100",
                   "--jq", ".[] | .filename, (.previous_filename // empty)"],
                  check=True, capture_output=True, text=True,
              )
              paths_by_pr[number] = [line for line in result.stdout.splitlines() if line]

          candidate = select_next_runtime_pr(
              prs,
              paths_by_pr,
              repository=os.environ["REPO"],
              package_bot_login=os.environ.get("PACKAGE_BOT_LOGIN"),
              policy=load_policy("trusted/.github/guarded-merge-policy.json"),
          )
          current = int(os.environ["PR_NUMBER"])
          owner = candidate.get("number") if candidate else None
          allowed = owner is None or owner == current
          print(json.dumps({"currentPR": current, "betaReservationPR": owner, "allowed": allowed}, sort_keys=True))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("allowed=" + ("true" if allowed else "false") + chr(10))
          if not allowed:
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
                  summary.write(f"Beta package reservation belongs to PR #{owner}; this PR waits until it merges.\n")
          PY

      - name: Build the Beta candidate with trusted code
        if: steps.base.outputs.current == 'true' && steps.parity.outputs.needs_package == 'true' && steps.reservation.outputs.allowed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 trusted/scripts/build_beta_package.py \
            --root candidate \
            --base-root trusted \
            --base-manifest trusted/updates/manifest.json \
            --release-notes "$PR_TITLE. Verified automated Beta from reviewed source. No Workspace migration; Stable remains unchanged."

      - name: Commit generated package locally
        id: commit
        if: steps.base.outputs.current == 'true' && steps.parity.outputs.needs_package == 'true' && steps.reservation.outputs.allowed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          if git diff --quiet -- CHANGELOG.md README.md updates/manifest.json updates/packages && [ -z "$(git ls-files --others --exclude-standard updates/packages)" ]; then
            echo "Reviewed runtime already matches the trusted Beta package."
            echo "generated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED="$(git status --porcelain)"
          if echo "$CHANGED" | grep -Ev '^( M|M |A |\?\?) (CHANGELOG\.md|README\.md|updates/manifest\.json|updates/packages/moondog-[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+\.json)$' | grep -q .; then
            echo "Trusted Beta builder attempted an unexpected file change:" >&2
            echo "$CHANGED" >&2
            exit 1
          fi
          git config user.name "MoonDog Automation"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md README.md updates/manifest.json updates/packages
          git commit -m "Package verified runtime in source PR"
          echo "generated=true" >> "$GITHUB_OUTPUT"

      - name: Create scoped MoonDog release App token
        id: release-app
        if: steps.commit.outputs.generated == 'true' && steps.reservation.outputs.allowed == 'true'
        uses: actions/create-github-app-token@67018539274d69449ef7c02e8e71183d1719ab42
        with:
          app-id: ${{ secrets.MOONDOG_RELEASE_APP_ID }}
          private-key: ${{ secrets.MOONDOG_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Push package commit to the same reviewed PR
        if: steps.commit.outputs.generated == 'true'
        shell: bash
        env:
          APP_TOKEN: ${{ steps.release-app.outputs.token }}
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
          APP_SLUG: ${{ steps.release-app.outputs.app-slug }}
          PACKAGE_BOT_LOGIN: ${{ vars.MOONDOG_RELEASE_APP_LOGIN }}
        run: |
          set -euo pipefail
          test -n "$APP_TOKEN"
          test -n "$APP_SLUG"
          test "$PACKAGE_BOT_LOGIN" = "$APP_SLUG[bot]"
          AUTH="$(printf 'x-access-token:%s' "$APP_TOKEN" | base64 -w0)"
          git -C candidate -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH" push origin "HEAD:$HEAD_BRANCH"
          # Review remains mandatory, but is supplied by an authenticated
          # exact-head GitHub PR review; do not invoke external coding agents.
          echo "Trusted Beta candidate pushed at $(git -C candidate rev-parse HEAD); exact-head owner review and both CI gates are still required."
          echo "Pushed the candidate with the installed MoonDog Release App; normal pull_request checks now verify the new exact head."
