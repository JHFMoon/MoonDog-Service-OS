name: Prepare Beta Package

on:
  workflow_dispatch:
    inputs:
      reviewed_commit:
        description: 'Merged runtime commit to backfill (full SHA)'
        required: true
        type: string
  push:
    branches: [main]
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

# Generated package commits explicitly dispatch their own verification because
# GitHub marks pull-request runs authored by github-actions[bot] as action_required.
permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

concurrency:
  group: prepare-beta-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.body, 'MoonDog-Auto-Merge: yes') &&
      (github.event.pull_request.author_association == 'OWNER' ||
       github.event.pull_request.author_association == 'MEMBER' ||
       github.event.pull_request.author_association == 'COLLABORATOR')
    runs-on: ubuntu-latest
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
      PR_TITLE: ${{ github.event.pull_request.title }}

    steps:
      - name: Check out trusted packaging logic from the reviewed base
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          fetch-depth: 1

      - name: Check out candidate without executing candidate code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0

      - name: Refuse automatic changes to trusted proof/automation files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/${{ github.repository }}/pulls/$PR_NUMBER/files?per_page=100"             --jq '.[].filename' > /tmp/pr-paths.txt
          python3 trusted/scripts/pipeline_guard.py check-paths /tmp/pr-paths.txt

      - name: Prepare next Beta only when reviewed runtime changed
        shell: bash
        run: |
          set -euo pipefail
          python3 trusted/scripts/build_beta_package.py --root candidate --base-root trusted --base-manifest trusted/updates/manifest.json --release-notes "$PR_TITLE. Verified automated Beta; no Workspace migration."

      - name: Commit generated Beta package back to the same PR branch
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          if git diff --quiet -- CHANGELOG.md README.md updates/manifest.json updates/packages && [ -z "$(git ls-files --others --exclude-standard updates/packages)" ]; then
            echo "Reviewed runtime already matches the advertised Beta package."
            echo "generated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED="$(git status --porcelain)"
          if echo "$CHANGED" | grep -Ev '^( M|M |A |\?\?) (CHANGELOG\.md|README\.md|updates/manifest\.json|updates/packages/moondog-[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+\.json)$' | grep -q .; then
            echo "Beta preparation attempted an unexpected file change:" >&2
            echo "$CHANGED" >&2
            exit 1
          fi
          git config user.name "MoonDog Automation"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md README.md updates/manifest.json updates/packages
          git commit -m "Package next verified Beta"
          git push origin "HEAD:$HEAD_BRANCH"
          echo "generated=true" >> "$GITHUB_OUTPUT"

      - name: Dispatch required checks for automation-generated head
        if: steps.commit.outputs.generated == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run publication-check.yml --repo "${{ github.repository }}" --ref "$HEAD_BRANCH"
          gh workflow run clean-install-proof.yml --repo "${{ github.repository }}" --ref "$HEAD_BRANCH"

      - name: Wait for generated-head proof and merge
        if: steps.commit.outputs.generated == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          CURRENT_HEAD="$(git -C candidate rev-parse HEAD)"
          export CURRENT_HEAD
          for attempt in {1..42}; do
            RUNS="$(gh api "repos/$REPO/actions/runs?head_sha=$CURRENT_HEAD&per_page=50")"
            PUB_OK="$(jq '[.workflow_runs[] | select(.name=="Publication check" and .conclusion=="success")] | length' <<<"$RUNS")"
            CLEAN_OK="$(jq '[.workflow_runs[] | select(.name=="Clean Install Proof" and .conclusion=="success")] | length' <<<"$RUNS")"
            PENDING="$(jq '[.workflow_runs[] | select((.name=="Publication check" or .name=="Clean Install Proof") and .status!="completed")] | length' <<<"$RUNS")"
            HARD_FAIL="$(jq '[.workflow_runs[] | select((.name=="Publication check" or .name=="Clean Install Proof") and (.conclusion=="failure" or .conclusion=="cancelled" or .conclusion=="timed_out"))] | length' <<<"$RUNS")"
            if [ "$HARD_FAIL" != "0" ]; then
              echo "Generated-head verification failed." >&2
              exit 1
            fi
            if [ "$PENDING" = "0" ] && [ "$PUB_OK" != "0" ] && [ "$CLEAN_OK" != "0" ]; then
              break
            fi
            if [ "$attempt" = "42" ]; then
              echo "Timed out waiting for all generated-head checks to settle." >&2
              exit 1
            fi
            sleep 10
          done

          PUB_RUN_ID="$(jq -r '[.workflow_runs[] | select(.name=="Publication check" and .conclusion=="success")][0].id // empty' <<<"$RUNS")"
          test -n "$PUB_RUN_ID" || {
            echo "Could not identify the successful Publication Check run." >&2
            exit 1
          }
          gh api -X POST "repos/$REPO/statuses/$CURRENT_HEAD"             -f state=success             -f context="Publication Check"             -f description="Exact-head Publication Check and Clean Install Proof passed"             -f target_url="https://github.com/$REPO/actions/runs/$PUB_RUN_ID"

          gh api "repos/$REPO/pulls/$PR_NUMBER" > /tmp/generated-pr.json
          python3 - <<'PY'
          import json, os
          pr=json.load(open('/tmp/generated-pr.json',encoding='utf-8'))
          checks={
              'open': pr.get('state')=='open',
              'draft': pr.get('draft') is False,
              'base': pr.get('base',{}).get('ref')=='main',
              'same_repo': pr.get('head',{}).get('repo',{}).get('full_name')==os.environ['REPO'],
              'head': pr.get('head',{}).get('sha')==os.environ['CURRENT_HEAD'],
              'authorization': 'MoonDog-Auto-Merge: yes' in (pr.get('body') or ''),
              'association': pr.get('author_association') in {'OWNER','MEMBER','COLLABORATOR'},
          }
          failed=[name for name,ok in checks.items() if not ok]
          if failed:
              raise SystemExit('Generated-head merge refused: '+', '.join(failed))
          PY

          STATUS="$(gh api "repos/$REPO/compare/main...$CURRENT_HEAD" --jq .status)"
          test "$STATUS" = "ahead" || {
            echo "Main advanced while the Beta was verifying; refusing a stale merge." >&2
            exit 1
          }

          MAIN_SHA="$(gh api "repos/$REPO/branches/main" --jq .commit.sha)"
          gh api -H "Accept: application/vnd.github.raw+json"             "repos/$REPO/contents/updates/manifest.json?ref=$MAIN_SHA" > /tmp/main-manifest.json
          gh api -H "Accept: application/vnd.github.raw+json"             "repos/$REPO/contents/updates/manifest.json?ref=$CURRENT_HEAD" > /tmp/head-manifest.json
          python3 - <<'PY'
          import json
          main=json.load(open('/tmp/main-manifest.json',encoding='utf-8'))
          head=json.load(open('/tmp/head-manifest.json',encoding='utf-8'))
          if main.get('stable') != head.get('stable'):
              raise SystemExit('Generated-head merge refused: Stable changed.')
          PY

          for attempt in {1..12}; do
            if RESULT="$(gh api -X PUT "repos/$REPO/pulls/$PR_NUMBER/merge" -f merge_method=squash -f sha="$CURRENT_HEAD" 2>&1)"; then
              jq '{merged:.merged,message:.message,sha:.sha}' <<<"$RESULT"
              test "$(jq -r '.merged' <<<"$RESULT")" = "true"
              MERGED_SHA="$(jq -r '.sha' <<<"$RESULT")"
              for settle in {1..12}; do
                MAIN_SHA="$(gh api "repos/$REPO/branches/main" --jq .commit.sha)"
                [ "$MAIN_SHA" = "$MERGED_SHA" ] && break
                sleep 2
              done
              test "$MAIN_SHA" = "$MERGED_SHA" || {
                echo "Merged commit did not become current main; refusing post-merge proof." >&2
                exit 1
              }
              gh workflow run publication-check.yml --repo "$REPO" --ref main
              exit 0
            fi
            if grep -Eq 'Required status check.*(in progress|expected)' <<<"$RESULT"; then
              sleep 5
              continue
            fi
            echo "$RESULT" >&2
            exit 1
          done
          echo "GitHub did not settle the generated-head status context in time." >&2
          exit 1

  backfill-merged-beta:
    if: (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted main and history
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Validate merged commit and prepare Beta on isolated branch
        shell: bash
        env:
          REVIEWED_COMMIT: ${{ inputs.reviewed_commit || '136857458c1dcdbd9e81222435c33781c400eda7' }}
        run: |
          set -euo pipefail
          git fetch origin main
          if [ "${{ github.event_name }}" = "push" ]; then
            CURRENT_BETA="$(python3 -c 'import json; print(json.load(open("updates/manifest.json"))["beta"]["version"])')"
            if [ "$CURRENT_BETA" != "0.10.18-beta.23" ]; then
              echo "Bootstrap Beta backfill already completed; skipping."
              exit 0
            fi
          fi
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || { echo "Main moved; retry on fresh main" >&2; exit 1; }
          git cat-file -e "$REVIEWED_COMMIT^{commit}"
          git merge-base --is-ancestor "$REVIEWED_COMMIT" HEAD || { echo "Commit is not merged into main" >&2; exit 1; }
          BASE="$(git rev-parse "$REVIEWED_COMMIT^")"
          mkdir -p /tmp/moondog-beta-backfill-base
          git archive "$BASE" | tar -x -C /tmp/moondog-beta-backfill-base
          cp updates/manifest.json /tmp/moondog-beta-backfill-base-manifest.json
          python3 scripts/build_beta_package.py --root . --base-root /tmp/moondog-beta-backfill-base --base-manifest /tmp/moondog-beta-backfill-base-manifest.json --release-notes "Backfill merged RO closeout fixes into verified Beta; Stable unchanged."
          test -n "$(git status --porcelain -- updates/manifest.json updates/packages)" || { echo "No un-packaged runtime changes; no release needed"; exit 0; }
          BRANCH="beta/backfill-$GITHUB_RUN_ID"
          git switch -c "$BRANCH"
          git config user.name "MoonDog Automation"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add updates/manifest.json updates/packages README.md CHANGELOG.md
          git commit -m "Backfill merged runtime into next Beta package"
          git push origin "$BRANCH"
          echo "BACKFILL_BRANCH=$BRANCH" >> "$GITHUB_ENV"
      - name: Open verified Beta PR (never push package directly to main)
        if: env.BACKFILL_BRANCH != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create --base main --head "$BACKFILL_BRANCH" --title "Backfill merged RO fixes into next Beta" --body "Reviewed merged runtime packaged with the trusted builder. Required Publication Check and Clean Install Proof must pass before guarded merge. Stable is unchanged."
