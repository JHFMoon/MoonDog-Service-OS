name: Publish Stable GitHub Release

on:
  workflow_run:
    workflows: ["Publication check"]
    types: [completed]
  workflow_dispatch:
    inputs:
      approval_reference:
        description: "James's explicit approval for emergency/manual Stable publication"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: stable-github-release
  cancel-in-progress: false

jobs:
  promotion-check:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    outputs:
      promoted: ${{ steps.detect.outputs.promoted }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
      - name: Publish only when approved Stable release is not yet complete
        id: detect
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          stable = json.loads(Path('updates/manifest.json').read_text())['stable']
          version = stable['version']
          expected_digest = f"sha256:{stable['sha256']}"
          tag = f'v{version}'
          asset = f'moondog-{version}.json'
          repo = os.environ['GITHUB_REPOSITORY']
          def read_release(url):
              request = Request(url, headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'X-GitHub-Api-Version': '2022-11-28',
              })
              try:
                  with urlopen(request, timeout=30) as response:
                      return json.load(response)
              except HTTPError as exc:
                  if exc.code != 404:
                      raise  # Fail closed on API/authorization errors.
                  return None

          release = read_release(f'https://api.github.com/repos/{repo}/releases/tags/{tag}')
          latest = read_release(f'https://api.github.com/repos/{repo}/releases/latest')

          # Do not treat an unverified or prerelease asset as a completed Stable.
          # An absent digest deliberately re-enters the release job, which
          # downloads and SHA-256-verifies the existing asset before success.
          release_ready = (
              release is not None
              and not release.get('draft')
              and not release.get('prerelease')
          )
          verified_asset = release_ready and any(
              item.get('name') == asset
              and item.get('state') == 'uploaded'
              and item.get('digest') == expected_digest
              for item in release.get('assets', [])
          )
          latest_matches = latest is not None and latest.get('tag_name') == tag
          promoted = str(not (verified_asset and latest_matches)).lower()
          print(f'Stable {tag}, verified asset={verified_asset}, latest={latest_matches}; publish={promoted}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'promoted={promoted}\n')
          PY

  publish:
    needs: promotion-check
    if: >-
      always() &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
       inputs.approval_reference != '') ||
      (needs.promotion-check.result == 'success' &&
       needs.promotion-check.outputs.promoted == 'true'))
    runs-on: ubuntu-latest
    env:
      HEAD_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out validated main commit
        uses: actions/checkout@v7
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0

      - name: Ensure validated commit is current main
        shell: bash
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$HEAD_SHA" || {
            echo 'Skipping stale validation: main advanced after the publication check.'
            exit 1
          }

      - name: Fetch all public refs for history audit
        run: git fetch --force --tags origin '+refs/heads/*:refs/remotes/origin/*'

      - name: Re-run release safety checks
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py'
          node --test tests/*.test.cjs
          python3 scripts/check_publication.py
          python3 scripts/audit_git_history.py

      - name: Read and verify Stable release contract
        id: stable
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          manifest = json.loads(Path("updates/manifest.json").read_text(encoding="utf-8"))
          stable = manifest["stable"]
          version = stable["version"]
          if not re.fullmatch(r"(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)", version):
              raise SystemExit("Stable version is invalid")

          package = Path("updates/packages") / f"moondog-{version}.json"
          if not package.is_file():
              raise SystemExit(f"Missing Stable package: {package}")

          expected_url = (
              f"https://raw.githubusercontent.com/JHFMoon/MoonDog-Service-OS/"
              f"v{version}/updates/packages/{package.name}"
          )
          if stable.get("packageUrl") != expected_url:
              raise SystemExit("Stable manifest must point to the CORS-safe matching Release tag mirror")

          package_bytes = package.read_bytes()
          digest = hashlib.sha256(package_bytes).hexdigest()
          if digest != stable.get("sha256"):
              raise SystemExit("Stable package SHA-256 does not match the manifest")

          package_json = json.loads(package_bytes)
          if package_json.get("version") != version:
              raise SystemExit("Stable package version does not match the manifest")

          notes = (
              f"Service Operations Dashboard {version}\n\n"
              f"{stable['releaseNotes'].strip()}\n\n"
              f"Updater package: {package.name}\n"
              f"SHA-256: {digest}\n"
              f"Minimum compatible version: {stable['minimumCompatibleVersion']}\n"
          )
          Path("stable-release-notes.md").write_text(notes, encoding="utf-8", newline="\n")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
              output.write(f"tag=v{version}\n")
              output.write(f"package={package.as_posix()}\n")
              output.write(f"asset={package.name}\n")
              output.write(f"sha256={digest}\n")
          PY

      - name: Create or verify the formal Stable GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.stable.outputs.tag }}"
          VERSION="${{ steps.stable.outputs.version }}"
          PACKAGE="${{ steps.stable.outputs.package }}"
          ASSET="${{ steps.stable.outputs.asset }}"
          SHA256="${{ steps.stable.outputs.sha256 }}"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fxq "$ASSET"; then
              rm -rf .stable-release-check
              mkdir .stable-release-check
              gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ASSET" --dir .stable-release-check
              printf '%s  %s\n' "$SHA256" ".stable-release-check/$ASSET" | sha256sum -c -
            else
              gh release upload "$TAG" "$PACKAGE#Verified updater package" --repo "$GITHUB_REPOSITORY"
            fi
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest
          else
            if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
              gh release create "$TAG" "$PACKAGE#Verified updater package" \
                --repo "$GITHUB_REPOSITORY" \
                --title "Service Operations Dashboard $VERSION" \
                --notes-file stable-release-notes.md \
                --latest
            else
              gh release create "$TAG" "$PACKAGE#Verified updater package" \
                --repo "$GITHUB_REPOSITORY" \
                --target "$HEAD_SHA" \
                --title "Service Operations Dashboard $VERSION" \
                --notes-file stable-release-notes.md \
                --latest
            fi
          fi

          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,name,isDraft,isPrerelease,assets,url
