name: Guarded PR Merge

on:
  workflow_run:
    workflows: ["Publication check"]
    types: [completed]
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, edited]
  issue_comment:
    types: [created]

permissions:
  # Required only to dispatch the trusted post-merge Beta packager.
  # Exact-head proof and current-main gates remain mandatory before merge.
  actions: write
  contents: write
  pull-requests: write
  issues: read

concurrency:
  group: guarded-pr-merge-${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  merge:
    if: >-
      ((github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        (github.event.workflow_run.event == 'pull_request' ||
         github.event.workflow_run.event == 'workflow_dispatch')) ||
       github.event_name == 'pull_request_target' ||
       (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        github.event.comment.user.login == 'chatgpt-codex-connector[bot]' &&
        contains(github.event.comment.body, 'codex-review-state:v1')))
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      HEAD_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.event.pull_request.head.sha }}
      HEAD_BRANCH: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.event.pull_request.head.ref }}
      PR_NUMBER: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.pull_requests[0].number || github.event.pull_request.number || github.event.issue.number }}
    steps:
      - name: Check out trusted merge guard from main
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - name: Verify automation authorization and PR safety
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$PR_NUMBER" ]; then
            OWNER="${REPO%%/*}"
            PR_NUMBER="$(gh api "repos/$REPO/pulls?state=open&head=$OWNER:$HEAD_BRANCH" --jq '.[0].number // empty')"
            if [ -z "$PR_NUMBER" ]; then
              echo "No open automation PR matches $HEAD_BRANCH; skipping safely."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "PR_NUMBER=$PR_NUMBER" >> "$GITHUB_ENV"
          fi
          gh api "repos/$REPO/pulls/$PR_NUMBER" > /tmp/pr.json
          if [ -z "$HEAD_SHA" ]; then
            HEAD_SHA="$(jq -r '.head.sha // empty' /tmp/pr.json)"
            echo "HEAD_SHA=$HEAD_SHA" >> "$GITHUB_ENV"
          fi
          # A workflow_run may refer to an older PR head after packaging or a
          # branch update. Skip that obsolete event; never use its checks to merge.
          CURRENT_PR_HEAD="$(jq -r '.head.sha // empty' /tmp/pr.json)"
          if [ -z "$HEAD_SHA" ] || [ -z "$CURRENT_PR_HEAD" ]; then
            echo "Missing verified event/PR head; refusing to proceed." >&2
            exit 1
          fi
          if [ "$CURRENT_PR_HEAD" != "$HEAD_SHA" ]; then
            echo "PR head moved since this verification event; skipping obsolete run."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          if [ "$(jq -r '.state' /tmp/pr.json)" != "open" ]; then
            echo "PR is closed or not authorized for automatic merge; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          python3 scripts/guarded_merge_policy.py check-authorization /tmp/pr.json --policy .github/guarded-merge-policy.json
          AUTHORIZATION_STATUS=$?
          set -e
          if [ "$AUTHORIZATION_STATUS" -eq 1 ]; then
            echo "PR has no explicit automatic-merge authorization; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$AUTHORIZATION_STATUS" -ne 0 ]; then
            echo "Could not verify structured PR authorization; refusing to merge." >&2
            exit "$AUTHORIZATION_STATUS"
          fi
          python3 - <<'PY'
          import json, os, sys
          from scripts.guarded_merge_policy import has_merge_authorization, load_policy
          pr=json.load(open('/tmp/pr.json',encoding='utf-8'))
          policy=load_policy('.github/guarded-merge-policy.json')
          expected=os.environ['HEAD_SHA']
          if pr.get('state')!='open':
              print('PR is no longer open; nothing to merge.')
              sys.exit(0)
          checks={
              'draft': pr.get('draft') is False,
              'base': pr.get('base',{}).get('ref')=='main',
              'same_repo': pr.get('head',{}).get('repo',{}).get('full_name')==os.environ['REPO'],
              'head': pr.get('head',{}).get('sha')==expected,
              'authorization': has_merge_authorization(pr.get('body'), policy),
              'association': pr.get('author_association') in {'OWNER','MEMBER','COLLABORATOR'},
          }
          failed=[name for name,ok in checks.items() if not ok]
          if failed:
              raise SystemExit('Guarded merge refused: '+', '.join(failed))
          PY

      - name: Classify verified release channel
        id: channel
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          MERGE_BASE_SHA="$(gh api "repos/$REPO/compare/main...$HEAD_SHA" --jq .merge_base_commit.sha)"
          test -n "$MERGE_BASE_SHA"
          gh api -H "Accept: application/vnd.github.raw+json" \
            "repos/$REPO/contents/updates/manifest.json?ref=$MERGE_BASE_SHA" > /tmp/base-manifest.json
          gh api -H "Accept: application/vnd.github.raw+json" \
            "repos/$REPO/contents/updates/manifest.json?ref=$HEAD_SHA" > /tmp/head-manifest.json
          STABLE_CHANGED="$(python3 - <<'PY'
          import json
          base=json.load(open('/tmp/base-manifest.json',encoding='utf-8'))
          head=json.load(open('/tmp/head-manifest.json',encoding='utf-8'))
          print('true' if base.get('stable') != head.get('stable') else 'false')
          PY
          )"
          echo "stable_changed=$STABLE_CHANGED" >> "$GITHUB_OUTPUT"

      - name: Wait for Publication, Clean Install, and exact-head Codex proof
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files?per_page=100" --jq '.[] | .filename, (.previous_filename // empty)' > /tmp/pr-paths.txt
          python3 scripts/pipeline_guard.py check-paths /tmp/pr-paths.txt

          # A GITHUB_TOKEN branch refresh may leave PR-triggered runs in an
          # approval-required state. Start missing proofs only after the trusted
          # path guard above and only on this verified same-repository head.
          RUNS="$(gh api "repos/$REPO/actions/runs?head_sha=$HEAD_SHA&per_page=50")"
          RUNS="$(jq --arg head "$HEAD_SHA" --arg repo "$REPO" '{workflow_runs: [.workflow_runs[] | select(.head_sha==$head and .head_repository.full_name==$repo and (.event=="pull_request" or .event=="workflow_dispatch")) | select((.name=="Publication check" and .path==".github/workflows/publication-check.yml") or (.name=="Clean Install Proof" and .path==".github/workflows/clean-install-proof.yml"))]}' <<<"$RUNS")"
          PUB_OK="$(jq '[.workflow_runs[] | select(.name=="Publication check" and .conclusion=="success")] | length' <<<"$RUNS")"
          CLEAN_OK="$(jq '[.workflow_runs[] | select(.name=="Clean Install Proof" and .conclusion=="success")] | length' <<<"$RUNS")"
          PUB_PENDING="$(jq '[.workflow_runs[] | select(.name=="Publication check" and .status!="completed")] | length' <<<"$RUNS")"
          CLEAN_PENDING="$(jq '[.workflow_runs[] | select(.name=="Clean Install Proof" and .status!="completed")] | length' <<<"$RUNS")"
          HARD_FAIL="$(jq '[.workflow_runs[] | select((.name=="Publication check" or .name=="Clean Install Proof") and (.conclusion=="failure" or .conclusion=="cancelled" or .conclusion=="timed_out"))] | length' <<<"$RUNS")"
          if [ "$HARD_FAIL" = "0" ]; then
            if [ "$PUB_OK" = "0" ] && [ "$PUB_PENDING" = "0" ]; then
              gh workflow run publication-check.yml --repo "$REPO" --ref "$HEAD_BRANCH"
            fi
            if [ "$CLEAN_OK" = "0" ] && [ "$CLEAN_PENDING" = "0" ]; then
              gh workflow run clean-install-proof.yml --repo "$REPO" --ref "$HEAD_BRANCH"
            fi
            gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments?per_page=100" --jq '.[]' | jq -s '.' > /tmp/pr-comments.json
            CODEX_STATE="$(python3 scripts/guarded_merge_policy.py codex-review-state /tmp/pr-comments.json "$HEAD_SHA")"
            REVIEW_REQUESTED="$(jq --arg head "$HEAD_SHA" '[.[] | select((.body | contains($head)) and (.body | contains("@codex review")))] | length' /tmp/pr-comments.json)"
            if [ "$CODEX_STATE" = "pending" ] && [ "$REVIEW_REQUESTED" = "0" ]; then
              CURRENT_MAIN="$(gh api "repos/$REPO/branches/main" --jq .commit.sha)"
              gh api -X POST "repos/$REPO/issues/$PR_NUMBER/comments" \
                -f body="@codex review

MoonDog-Codex-Review-Request:$HEAD_SHA
Review exact head $HEAD_SHA against current main $CURRENT_MAIN after the trusted path check. Review the full PR diff and report findings for this exact commit."
            fi
          fi

          for attempt in {1..42}; do
            RUNS="$(gh api "repos/$REPO/actions/runs?head_sha=$HEAD_SHA&per_page=50")"
            RUNS="$(jq --arg head "$HEAD_SHA" --arg repo "$REPO" '{workflow_runs: [.workflow_runs[] | select(.head_sha==$head and .head_repository.full_name==$repo and (.event=="pull_request" or .event=="workflow_dispatch")) | select((.name=="Publication check" and .path==".github/workflows/publication-check.yml") or (.name=="Clean Install Proof" and .path==".github/workflows/clean-install-proof.yml"))]}' <<<"$RUNS")"
            PUB_OK="$(jq '[.workflow_runs[] | select(.name=="Publication check" and .conclusion=="success")] | length' <<<"$RUNS")"
            CLEAN_OK="$(jq '[.workflow_runs[] | select(.name=="Clean Install Proof" and .conclusion=="success")] | length' <<<"$RUNS")"
            PENDING="$(jq '[.workflow_runs[] | select((.name=="Publication check" or .name=="Clean Install Proof") and .status!="completed")] | length' <<<"$RUNS")"
            HARD_FAIL="$(jq '[.workflow_runs[] | select((.name=="Publication check" or .name=="Clean Install Proof") and (.conclusion=="failure" or .conclusion=="cancelled" or .conclusion=="timed_out"))] | length' <<<"$RUNS")"
            gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments?per_page=100" --jq '.[]' | jq -s '.' > /tmp/pr-comments.json
            CODEX_STATE="$(python3 scripts/guarded_merge_policy.py codex-review-state /tmp/pr-comments.json "$HEAD_SHA")"
            if [ "$HARD_FAIL" != "0" ]; then
              echo "Required verification failed on the exact PR head." >&2
              exit 1
            fi
            if [ "$CODEX_STATE" = "findings" ]; then
              echo "Exact-head Codex review reported findings; refusing merge." >&2
              exit 1
            fi
            if [ "$PENDING" = "0" ] && [ "$PUB_OK" != "0" ] && [ "$CLEAN_OK" != "0" ] && [ "$CODEX_STATE" = "clean" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for exact-head Publication, Clean Install, and Codex review proof to settle." >&2
          exit 1

      - name: Bring branch current with main if needed
        if: steps.guard.outputs.skip != 'true'
        id: current
        shell: bash
        run: |
          set -euo pipefail
          STATUS="$(gh api "repos/$REPO/compare/main...$HEAD_SHA" --jq .status)"
          if [ "$STATUS" = "diverged" ] || [ "$STATUS" = "behind" ]; then
            if ! gh api -X PUT "repos/$REPO/pulls/$PR_NUMBER/update-branch" -f expected_head_sha="$HEAD_SHA"; then
              echo "GitHub refused the additive main refresh for PR #$PR_NUMBER." >&2
              exit 1
            fi
            echo "Requested additive refresh for PR #$PR_NUMBER; waiting for GitHub to publish the new head."
            UPDATE_BASE="$HEAD_SHA"
            UPDATED=false
            for settle in {1..42}; do
              gh api "repos/$REPO/pulls/$PR_NUMBER" > /tmp/refreshed-current-pr.json
              REFRESHED_HEAD="$(jq -r '.head.sha // empty' /tmp/refreshed-current-pr.json)"
              REFRESHED_BRANCH="$(jq -r '.head.ref // empty' /tmp/refreshed-current-pr.json)"
              CURRENT_MAIN="$(gh api "repos/$REPO/branches/main" --jq .commit.sha)"
              if [ -n "$REFRESHED_HEAD" ] && [ "$REFRESHED_HEAD" != "$UPDATE_BASE" ]; then
                REFRESH_COMPARE="$(gh api "repos/$REPO/compare/$CURRENT_MAIN...$REFRESHED_HEAD")"
                REFRESH_STATUS="$(jq -r .status <<<"$REFRESH_COMPARE")"
                REFRESH_BASE="$(jq -r '.merge_base_commit.sha // empty' <<<"$REFRESH_COMPARE")"
                if [ "$REFRESH_STATUS" = "ahead" ] && [ "$REFRESH_BASE" = "$CURRENT_MAIN" ]; then
                  UPDATED=true
                  break
                fi
                if [ "$REFRESH_STATUS" = "behind" ] || [ "$REFRESH_STATUS" = "diverged" ]; then
                  if ! gh api -X PUT "repos/$REPO/pulls/$PR_NUMBER/update-branch" -f expected_head_sha="$REFRESHED_HEAD"; then
                    echo "GitHub refused the follow-up additive refresh for PR #$PR_NUMBER." >&2
                    exit 1
                  fi
                  UPDATE_BASE="$REFRESHED_HEAD"
                fi
              fi
              sleep 10
            done
            if [ "$UPDATED" != "true" ]; then
              echo "PR #$PR_NUMBER did not settle on an exact current-main descendant; refusing to dispatch stale verification." >&2
              exit 1
            fi
            # GITHUB_TOKEN branch updates do not trigger pull_request workflows.
            # Dispatch both required proofs only after the refreshed head is visible
            # and its merge base is the current main commit.
            gh workflow run publication-check.yml --repo "$REPO" --ref "$REFRESHED_BRANCH"
            gh workflow run clean-install-proof.yml --repo "$REPO" --ref "$REFRESHED_BRANCH"
            gh api -X POST "repos/$REPO/issues/$PR_NUMBER/comments" \
              -f body="@codex review

Review exact head $REFRESHED_HEAD against current main $CURRENT_MAIN after the additive branch refresh. Check the full PR diff and report findings for this exact commit."
            echo "updated=true" >> "$GITHUB_OUTPUT"
            echo "Verified refreshed PR #$PR_NUMBER head $REFRESHED_HEAD; exact-head checks and review request dispatched."
          else
            echo "updated=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Squash merge verified current PR
        if: steps.guard.outputs.skip != 'true' && steps.current.outputs.updated != 'true'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            gh api "repos/$REPO/pulls/$PR_NUMBER" > /tmp/final-pr.json
            gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files?per_page=100" --jq '.[] | .filename, (.previous_filename // empty)' > /tmp/final-pr-paths.txt
            python3 scripts/pipeline_guard.py check-paths /tmp/final-pr-paths.txt
            MAIN_SHA="$(gh api "repos/$REPO/branches/main" --jq .commit.sha)"
            CURRENT_HEAD="$(jq -r '.head.sha' /tmp/final-pr.json)"
            test "$CURRENT_HEAD" = "$HEAD_SHA" || {
              echo "PR head changed after verification; refusing stale merge." >&2
              exit 1
            }

            python3 - <<'PY'
          import json, os
          from scripts.guarded_merge_policy import codex_review_state, has_merge_authorization, load_policy
          pr=json.load(open('/tmp/final-pr.json',encoding='utf-8'))
          policy=load_policy('.github/guarded-merge-policy.json')
          comments=json.load(open('/tmp/pr-comments.json',encoding='utf-8'))
          checks={
              'open': pr.get('state')=='open',
              'draft': pr.get('draft') is False,
              'base': pr.get('base',{}).get('ref')=='main',
              'same_repo': pr.get('head',{}).get('repo',{}).get('full_name')==os.environ['REPO'],
              'head': pr.get('head',{}).get('sha')==os.environ['HEAD_SHA'],
              'authorization': has_merge_authorization(pr.get('body'), policy),
              'association': pr.get('author_association') in {'OWNER','MEMBER','COLLABORATOR'},
          }
          failed=[name for name,ok in checks.items() if not ok]
          if failed:
              raise SystemExit('Final guarded merge refused: '+', '.join(failed))
          PY

            COMPARE="$(gh api "repos/$REPO/compare/$MAIN_SHA...$HEAD_SHA")"
            STATUS="$(jq -r .status <<<"$COMPARE")"
            MERGE_BASE="$(jq -r .merge_base_commit.sha <<<"$COMPARE")"
            test "$STATUS" = "ahead" && test "$MERGE_BASE" = "$MAIN_SHA" || {
              echo "PR is no longer based on current main; refusing merge until it updates and rechecks." >&2
              exit 1
            }

            gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments?per_page=100" --jq '.[]' | jq -s '.' > /tmp/final-pr-comments.json
            python3 - <<'PY'
          import json, os
          from scripts.guarded_merge_policy import codex_review_state
          comments=json.load(open('/tmp/final-pr-comments.json',encoding='utf-8'))
          if codex_review_state(comments, os.environ['HEAD_SHA']) != 'clean':
              raise SystemExit('Final guarded merge refused: exact-head Codex review is missing, stale, or has findings.')
          PY

            if RESULT="$(gh api -X PUT "repos/$REPO/pulls/$PR_NUMBER/merge" -f merge_method=squash -f sha="$HEAD_SHA" 2>&1)"; then
              jq '{merged:.merged,message:.message,sha:.sha}' <<<"$RESULT"
              test "$(jq -r '.merged' <<<"$RESULT")" = "true"
              MERGED_SHA="$(jq -r '.sha' <<<"$RESULT")"
              for settle in {1..12}; do
                MAIN_SHA="$(gh api "repos/$REPO/branches/main" --jq .commit.sha)"
                [ "$MAIN_SHA" = "$MERGED_SHA" ] && break
                sleep 2
              done
              test "$MAIN_SHA" = "$MERGED_SHA" || {
                echo "Merged commit did not become current main." >&2
                exit 1
              }
              gh workflow run publication-check.yml --repo "$REPO" --ref main
              # GITHUB_TOKEN merges do not create push-triggered package runs.
              # Dispatch packaging from verified main, using the exact merged SHA.
              # The trusted packager handles Beta-only runtime changes. Stable
              # promotion is left to the existing Stable Release workflow.
              if [ "${{ steps.channel.outputs.stable_changed }}" = "true" ]; then
                echo "Stable changed under standing authorization; the existing Stable Release workflow owns publication."
              else
                gh workflow run prepare-beta-package.yml --repo "$REPO" --ref main -f reviewed_commit="$MERGED_SHA"
              fi
              # Refresh other open same-repository PRs from current main using
              # GitHub's additive update-branch operation, never force-pushing.
              OPEN_PRS="$(gh api "repos/$REPO/pulls?state=open&per_page=100")"
              PR_IDS="$(jq -r --arg repo "$REPO" '.[] | select(.base.ref=="main" and .head.repo.full_name==$repo) | .number' <<<"$OPEN_PRS")"
              while IFS= read -r OTHER_PR; do
                [ -n "$OTHER_PR" ] || continue
                gh api "repos/$REPO/pulls/$OTHER_PR" > /tmp/other-pr.json
                OTHER_HEAD="$(jq -r '.head.sha' /tmp/other-pr.json)"
                OTHER_DRAFT="$(jq -r '.draft' /tmp/other-pr.json)"
                OTHER_ASSOC="$(jq -r '.author_association' /tmp/other-pr.json)"
                [ "$OTHER_DRAFT" = "false" ] || continue
                case "$OTHER_ASSOC" in OWNER|MEMBER|COLLABORATOR) ;; *) continue ;; esac
                OTHER_REPO="$(jq -r '.head.repo.full_name // empty' /tmp/other-pr.json)"
                [ "$OTHER_REPO" = "$REPO" ] || continue
                gh api --paginate "repos/$REPO/pulls/$OTHER_PR/files?per_page=100" --jq '.[] | .filename, (.previous_filename // empty)' > /tmp/other-pr-paths.txt
                if ! python3 scripts/pipeline_guard.py check-paths /tmp/other-pr-paths.txt; then
                  echo "PR #$OTHER_PR changes protected workflow/security paths; leaving it for the reviewed bootstrap route."
                  continue
                fi
                OTHER_STATUS="$(gh api "repos/$REPO/compare/main...$OTHER_HEAD" --jq .status)"
                if [ "$OTHER_STATUS" = "behind" ] || [ "$OTHER_STATUS" = "diverged" ]; then
                  if gh api -X PUT "repos/$REPO/pulls/$OTHER_PR/update-branch" -f expected_head_sha="$OTHER_HEAD"; then
                    echo "Requested additive main refresh for PR #$OTHER_PR; waiting for the refreshed head."
                    UPDATE_BASE="$OTHER_HEAD"
                    UPDATED=false
                    for settle in {1..42}; do
                      gh api "repos/$REPO/pulls/$OTHER_PR" > /tmp/refreshed-pr.json
                      REFRESHED_HEAD="$(jq -r '.head.sha // empty' /tmp/refreshed-pr.json)"
                      REFRESHED_BRANCH="$(jq -r '.head.ref // empty' /tmp/refreshed-pr.json)"
                      CURRENT_MAIN="$(gh api "repos/$REPO/branches/main" --jq .commit.sha)"
                      if [ -n "$REFRESHED_HEAD" ] && [ "$REFRESHED_HEAD" != "$UPDATE_BASE" ]; then
                        REFRESH_COMPARE="$(gh api "repos/$REPO/compare/$CURRENT_MAIN...$REFRESHED_HEAD")"
                        REFRESH_STATUS="$(jq -r .status <<<"$REFRESH_COMPARE")"
                        REFRESH_BASE="$(jq -r '.merge_base_commit.sha // empty' <<<"$REFRESH_COMPARE")"
                        if [ "$REFRESH_STATUS" = "ahead" ] && [ "$REFRESH_BASE" = "$CURRENT_MAIN" ]; then
                          UPDATED=true
                          break
                        fi
                        if [ "$REFRESH_STATUS" = "behind" ] || [ "$REFRESH_STATUS" = "diverged" ]; then
                          if ! gh api -X PUT "repos/$REPO/pulls/$OTHER_PR/update-branch" -f expected_head_sha="$REFRESHED_HEAD"; then
                            echo "GitHub refused the additive refresh for PR #$OTHER_PR; no alternate ref operation will be attempted." >&2
                            exit 1
                          fi
                          UPDATE_BASE="$REFRESHED_HEAD"
                        fi
                      fi
                      sleep 10
                    done
                    if [ "$UPDATED" != "true" ]; then
                      echo "PR #$OTHER_PR did not settle on an exact current-main descendant; refusing to dispatch stale verification." >&2
                      exit 1
                    fi
                    # Updates made with GITHUB_TOKEN do not trigger pull_request
                    # workflows. Dispatch both required proofs only after the
                    # PR API confirms the new head includes current main.
                    gh workflow run publication-check.yml --repo "$REPO" --ref "$REFRESHED_BRANCH"
                    gh workflow run clean-install-proof.yml --repo "$REPO" --ref "$REFRESHED_BRANCH"
                    gh api -X POST "repos/$REPO/issues/$OTHER_PR/comments" \
                      -f body="@codex review

Review exact head $REFRESHED_HEAD against current main $CURRENT_MAIN after the additive branch refresh. Check the full PR diff and report findings for this exact commit."
                    echo "Verified refreshed PR #$OTHER_PR head $REFRESHED_HEAD; exact-head checks and review request dispatched."
                  else
                    echo "Could not refresh PR #$OTHER_PR without a conflict; leaving it unchanged."
                  fi
                fi
              done <<<"$PR_IDS"
              exit 0
            fi
            if grep -Eq 'Required status check.*(in progress|expected)' <<<"$RESULT"; then
              sleep 5
              continue
            fi
            echo "$RESULT" >&2
            exit 1
          done
          echo "GitHub did not settle the required status context in time." >&2
          exit 1
