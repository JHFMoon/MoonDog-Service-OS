name: Guarded PR Merge

on:
  workflow_run:
    workflows: ["Publication check", "Clean Install Proof"]
    types: [completed]
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, edited, closed]
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: guarded-pr-merge-${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  merge:
    if: >-
      ((github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'pull_request') ||
       github.event_name == 'pull_request_target' ||
       (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        github.event.comment.user.login == 'chatgpt-codex-connector[bot]' &&
        contains(github.event.comment.body, 'codex-review-state:v1')) ||
       (github.event_name == 'pull_request_review' &&
        github.event.review.user.login == 'JHFMoon' &&
        contains(github.event.review.body, 'MoonDog-Owner-Review: approved')))
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      HEAD_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.event.pull_request.head.sha }}
      HEAD_BRANCH: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.event.pull_request.head.ref }}
      PR_NUMBER: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.pull_requests[0].number || github.event.pull_request.number || github.event.issue.number }}
      PACKAGE_BOT_LOGIN: ${{ vars.MOONDOG_RELEASE_APP_LOGIN }}
    steps:
      - name: Check out trusted merge guard from main
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - name: Verify automation authorization and PR safety
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$PR_NUMBER" ]; then
            OWNER="${REPO%%/*}"
            PR_NUMBER="$(gh api "repos/$REPO/pulls?state=open&head=$OWNER:$HEAD_BRANCH" --jq '.[0].number // empty')"
            if [ -z "$PR_NUMBER" ]; then
              echo "No open automation PR matches $HEAD_BRANCH; skipping safely."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "PR_NUMBER=$PR_NUMBER" >> "$GITHUB_ENV"
          fi
          gh api "repos/$REPO/pulls/$PR_NUMBER" > /tmp/pr.json
          if [ -z "$HEAD_SHA" ]; then
            HEAD_SHA="$(jq -r '.head.sha // empty' /tmp/pr.json)"
            echo "HEAD_SHA=$HEAD_SHA" >> "$GITHUB_ENV"
          fi
          CURRENT_PR_HEAD="$(jq -r '.head.sha // empty' /tmp/pr.json)"
          if [ -z "$HEAD_SHA" ] || [ -z "$CURRENT_PR_HEAD" ]; then
            echo "Missing verified event/PR head; refusing to proceed." >&2
            exit 1
          fi
          if [ "$CURRENT_PR_HEAD" != "$HEAD_SHA" ]; then
            echo "PR head moved since this verification event; skipping obsolete run."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CURRENT_PR_BRANCH="$(jq -r '.head.ref // empty' /tmp/pr.json)"
          if [ -z "$CURRENT_PR_BRANCH" ]; then
            echo "Missing verified PR branch; refusing to proceed." >&2
            exit 1
          fi
          HEAD_BRANCH="$CURRENT_PR_BRANCH"
          echo "HEAD_BRANCH=$HEAD_BRANCH" >> "$GITHUB_ENV"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          if [ "$(jq -r '.state' /tmp/pr.json)" != "open" ]; then
            echo "PR is closed; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          python3 scripts/guarded_merge_policy.py check-authorization /tmp/pr.json --policy .github/guarded-merge-policy.json
          AUTHORIZATION_STATUS=$?
          set -e
          if [ "$AUTHORIZATION_STATUS" -eq 1 ]; then
            echo "PR has no explicit automatic-merge authorization; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$AUTHORIZATION_STATUS" -ne 0 ]; then
            echo "Could not verify structured PR authorization; refusing to proceed." >&2
            exit "$AUTHORIZATION_STATUS"
          fi
          python3 - <<'PY'
          import json, os, sys
          from scripts.guarded_merge_policy import has_accepted_pr_author, has_merge_authorization, load_policy
          pr=json.load(open('/tmp/pr.json',encoding='utf-8'))
          policy=load_policy('.github/guarded-merge-policy.json')
          expected=os.environ['HEAD_SHA']
          checks={
              'open': pr.get('state')=='open',
              'draft': pr.get('draft') is False,
              'base': pr.get('base',{}).get('ref')=='main',
              'same_repo': pr.get('head',{}).get('repo',{}).get('full_name')==os.environ['REPO'],
              'head': pr.get('head',{}).get('sha')==expected,
              'authorization': has_merge_authorization(pr.get('body'), policy),
              'association': has_accepted_pr_author(pr, os.environ['REPO'], os.environ.get('PACKAGE_BOT_LOGIN')),
          }
          failed=[name for name,ok in checks.items() if not ok]
          if failed:
              raise SystemExit('Guarded merge refused: '+', '.join(failed))
          PY
          gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files?per_page=100" --jq '.[] | .filename, (.previous_filename // empty)' > /tmp/pr-paths.txt
          python3 scripts/pipeline_guard.py check-paths /tmp/pr-paths.txt

      - name: Create scoped MoonDog release App token
        id: release-app
        if: steps.guard.outputs.skip != 'true'
        uses: actions/create-github-app-token@67018539274d69449ef7c02e8e71183d1719ab42
        with:
          app-id: ${{ secrets.MOONDOG_RELEASE_APP_ID }}
          private-key: ${{ secrets.MOONDOG_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-actions: read
          permission-checks: read
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Additively refresh this PR if main advanced
        id: current
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
        run: |
          set -euo pipefail
          COMPARE="$(gh api "repos/$REPO/compare/main...$HEAD_SHA")"
          STATUS="$(jq -r .status <<<"$COMPARE")"
          MERGE_BASE="$(jq -r '.merge_base_commit.sha // empty' <<<"$COMPARE")"
          MAIN_SHA="$(gh api "repos/$REPO/branches/main" --jq .commit.sha)"
          if [ "$STATUS" = "ahead" ] && [ "$MERGE_BASE" = "$MAIN_SHA" ]; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$STATUS" = "behind" ] || [ "$STATUS" = "diverged" ]; then
            gh api -X PUT "repos/$REPO/pulls/$PR_NUMBER/update-branch" -f expected_head_sha="$HEAD_SHA" >/dev/null
            echo "updated=true" >> "$GITHUB_OUTPUT"
            echo "Requested one additive main refresh; the new synchronize event will start fresh exact-head checks."
            exit 0
          fi
          echo "PR is not a strict descendant of current main; refusing to merge."
          exit 1

      - name: Check out verified PR candidate as untrusted data
        if: steps.guard.outputs.skip != 'true' && steps.current.outputs.updated != 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ env.HEAD_SHA }}
          path: candidate
          fetch-depth: 1
          persist-credentials: false

      - name: Refuse Stable manifest changes
        if: steps.guard.outputs.skip != 'true' && steps.current.outputs.updated != 'true'
        shell: bash
        run: |
          set -euo pipefail
          MERGE_BASE_SHA="$(gh api "repos/$REPO/compare/main...$HEAD_SHA" --jq .merge_base_commit.sha)"
          test -n "$MERGE_BASE_SHA"
          gh api -H "Accept: application/vnd.github.raw+json" \
            "repos/$REPO/contents/updates/manifest.json?ref=$MERGE_BASE_SHA" > /tmp/base-manifest.json
          gh api -H "Accept: application/vnd.github.raw+json" \
            "repos/$REPO/contents/updates/manifest.json?ref=$HEAD_SHA" > /tmp/head-manifest.json
          python3 - <<'PY'
          import json
          base=json.load(open('/tmp/base-manifest.json',encoding='utf-8'))
          head=json.load(open('/tmp/head-manifest.json',encoding='utf-8'))
          if base.get('stable') != head.get('stable'):
              raise SystemExit('Stable manifest changes are out of scope for automated Beta merging.')
          PY

      - name: Verify Beta package matches the exact PR runtime
        id: package-parity
        if: steps.guard.outputs.skip != 'true' && steps.current.outputs.updated != 'true'
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python3 - <<'PY'
          import json
          from pathlib import Path
          from scripts.build_beta_package import current_beta_runtime_mismatches

          mismatches = current_beta_runtime_mismatches(Path("candidate"))
          print(json.dumps({"runtimeMismatches": mismatches}, sort_keys=True))
          if mismatches:
              raise SystemExit(
                  "Guarded merge refused: the exact PR runtime is not present in its integrity-checked Beta package."
              )
          PY

      - name: Evaluate exact-head Publication, Clean Install, and Codex proof
        id: proof
        if: steps.guard.outputs.skip != 'true' && steps.current.outputs.updated != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
        run: |
          set -euo pipefail
          gh api "repos/$REPO/actions/runs?head_sha=$HEAD_SHA&per_page=100" > /tmp/head-runs.json
          gh api "repos/$REPO/commits/$HEAD_SHA/check-runs?per_page=100" > /tmp/head-checks.json
          python3 - <<'PY'
          import json, os, sys
          runs=json.load(open('/tmp/head-runs.json',encoding='utf-8')).get('workflow_runs',[])
          repo=os.environ['REPO']
          head=os.environ['HEAD_SHA']
          specs={
              'Publication check': '.github/workflows/publication-check.yml',
              'Clean Install Proof': '.github/workflows/clean-install-proof.yml',
          }
          latest={}
          for name,path in specs.items():
              matches=[r for r in runs if r.get('name')==name and r.get('path')==path and
                       r.get('head_sha')==head and r.get('event')=='pull_request' and
                       r.get('head_repository',{}).get('full_name')==repo]
              latest[name]=max(matches,key=lambda r:r.get('created_at') or '') if matches else None
          check_runs=json.load(open('/tmp/head-checks.json',encoding='utf-8')).get('check_runs',[])
          selected={}
          for name,run in latest.items():
              if run is None:
                  selected[name]='pending'
                  continue
              check_name='Publication Check' if name=='Publication check' else 'prove-clean-install'
              suite=run.get('check_suite_id')
              matches=[c for c in check_runs if c.get('name')==check_name and c.get('head_sha')==head and
                       c.get('app',{}).get('id')==15368 and c.get('check_suite',{}).get('id')==suite]
              result=max(matches,key=lambda c:c.get('started_at') or '') if matches else None
              if result is None or result.get('status')!='completed':
                  selected[name]='pending'
              elif result.get('conclusion')=='success':
                  selected[name]='success'
              else:
                  selected[name]='failure'
          print(json.dumps(selected,sort_keys=True))
          if 'failure' in selected.values():
              raise SystemExit('Latest exact-head Publication Check or Clean Install Proof failed.')
          if not all(selected[name]=='success' for name in specs):
              open(os.environ['GITHUB_OUTPUT'],'a').write('ready=false\n')
              sys.exit(0)
          PY
          if ! grep -q '^ready=false$' "$GITHUB_OUTPUT"; then
            gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments?per_page=100" --jq '.[]' | jq -s '.' > /tmp/pr-comments.json
            gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/reviews?per_page=100" --jq '.[]' | jq -s '.' > /tmp/pr-reviews.json
            REVIEW_STATE="$(python3 scripts/guarded_merge_policy.py merge-review-state /tmp/pr-comments.json /tmp/pr-reviews.json "$HEAD_SHA" --policy .github/guarded-merge-policy.json)"
            if [ "$REVIEW_STATE" = "findings" ]; then
              echo "Exact-head Codex or owner review reported findings; refusing merge." >&2
              exit 1
            fi
            # Pending review is not permission to summon a third-party agent.
            # The exact-head owner GitHub review remains required by the trusted
            # policy and unresolved authenticated findings still veto merging.
            if [ "$REVIEW_STATE" = "clean" ]; then
              echo "ready=true" >> "$GITHUB_OUTPUT"
            else
              echo "ready=false" >> "$GITHUB_OUTPUT"
              echo "Exact-head review remains pending; its review event will reevaluate this PR."
            fi
          else
            echo "Required exact-head checks are pending; workflow_run will reevaluate this PR."
          fi

      - name: Squash merge verified current PR
        if: steps.guard.outputs.skip != 'true' && steps.proof.outputs.ready == 'true' && steps.current.outputs.updated != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
        run: |
          set -euo pipefail
          gh api "repos/$REPO/pulls/$PR_NUMBER" > /tmp/final-pr.json
          gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files?per_page=100" --jq '.[] | .filename, (.previous_filename // empty)' > /tmp/final-pr-paths.txt
          python3 scripts/pipeline_guard.py check-paths /tmp/final-pr-paths.txt
          CURRENT_HEAD="$(jq -r '.head.sha // empty' /tmp/final-pr.json)"
          test "$CURRENT_HEAD" = "$HEAD_SHA" || {
            echo "PR head changed after exact-head verification; refusing stale merge." >&2
            exit 1
          }
          MAIN_SHA="$(gh api "repos/$REPO/branches/main" --jq .commit.sha)"
          COMPARE="$(gh api "repos/$REPO/compare/$MAIN_SHA...$HEAD_SHA")"
          test "$(jq -r .status <<<"$COMPARE")" = "ahead" &&
          test "$(jq -r '.merge_base_commit.sha // empty' <<<"$COMPARE")" = "$MAIN_SHA" || {
            echo "PR no longer descends from current main; a new sync and exact-head proof are required." >&2
            exit 1
          }
          gh api "repos/$REPO/actions/runs?head_sha=$HEAD_SHA&per_page=100" > /tmp/final-head-runs.json
          gh api "repos/$REPO/commits/$HEAD_SHA/check-runs?per_page=100" > /tmp/final-head-checks.json
          python3 - <<'PY'
          import json, os, sys
          runs=json.load(open('/tmp/final-head-runs.json',encoding='utf-8')).get('workflow_runs',[])
          checks=json.load(open('/tmp/final-head-checks.json',encoding='utf-8')).get('check_runs',[])
          repo=os.environ['REPO']; head=os.environ['HEAD_SHA']
          specs={'Publication check':('.github/workflows/publication-check.yml','Publication Check'),
                 'Clean Install Proof':('.github/workflows/clean-install-proof.yml','prove-clean-install')}
          for workflow,(path,check_name) in specs.items():
              matches=[r for r in runs if r.get('name')==workflow and r.get('path')==path and r.get('head_sha')==head and
                       r.get('event')=='pull_request' and r.get('head_repository',{}).get('full_name')==repo]
              run=max(matches,key=lambda r:r.get('created_at') or '') if matches else None
              if run is None:
                  raise SystemExit(f'Final guarded merge refused: no real pull_request {workflow} run for exact head.')
              found=[c for c in checks if c.get('name')==check_name and c.get('head_sha')==head and c.get('app',{}).get('id')==15368 and
                     c.get('check_suite',{}).get('id')==run.get('check_suite_id')]
              latest=max(found,key=lambda c:c.get('started_at') or '') if found else None
              if not latest or latest.get('status')!='completed' or latest.get('conclusion')!='success':
                  raise SystemExit(f'Final guarded merge refused: exact-head {workflow} evidence is not successful.')
          PY
          gh api -H "Accept: application/vnd.github.raw+json" \
            "repos/$REPO/contents/updates/manifest.json?ref=$MAIN_SHA" > /tmp/main-manifest.json
          gh api -H "Accept: application/vnd.github.raw+json" \
            "repos/$REPO/contents/updates/manifest.json?ref=$HEAD_SHA" > /tmp/head-manifest.json
          python3 - <<'PY'
          import json, os, sys
          from scripts.guarded_merge_policy import has_accepted_pr_author, has_merge_authorization, load_policy
          pr=json.load(open('/tmp/final-pr.json',encoding='utf-8'))
          policy=load_policy('.github/guarded-merge-policy.json')
          main=json.load(open('/tmp/main-manifest.json',encoding='utf-8'))
          head=json.load(open('/tmp/head-manifest.json',encoding='utf-8'))
          if main.get('stable') != head.get('stable'):
              raise SystemExit('Final guarded merge refused: Stable changed.')
          checks={
              'open': pr.get('state')=='open',
              'draft': pr.get('draft') is False,
              'base': pr.get('base',{}).get('ref')=='main',
              'same_repo': pr.get('head',{}).get('repo',{}).get('full_name')==os.environ['REPO'],
              'head': pr.get('head',{}).get('sha')==os.environ['HEAD_SHA'],
              'authorization': has_merge_authorization(pr.get('body'), policy),
              'association': has_accepted_pr_author(pr, os.environ['REPO'], os.environ.get('PACKAGE_BOT_LOGIN')),
          }
          failed=[name for name,ok in checks.items() if not ok]
          if failed:
              raise SystemExit('Final guarded merge refused: '+', '.join(failed))
          PY
          gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments?per_page=100" --jq '.[]' | jq -s '.' > /tmp/final-pr-comments.json
          gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/reviews?per_page=100" --jq '.[]' | jq -s '.' > /tmp/final-pr-reviews.json
          python3 - <<'PY'
          import json, os
          from scripts.guarded_merge_policy import merge_review_state, load_policy
          comments=json.load(open('/tmp/final-pr-comments.json',encoding='utf-8'))
          reviews=json.load(open('/tmp/final-pr-reviews.json',encoding='utf-8'))
          policy=load_policy('.github/guarded-merge-policy.json')
          if merge_review_state(comments, reviews, os.environ['HEAD_SHA'], policy) != 'clean':
              raise SystemExit('Final guarded merge refused: exact-head review is missing, stale, or has findings.')
          PY
          RESULT="$(gh api -X PUT "repos/$REPO/pulls/$PR_NUMBER/merge" -f merge_method=squash -f sha="$HEAD_SHA")"
          test "$(jq -r '.merged' <<<"$RESULT")" = "true" || {
            echo "GitHub protected merge was denied; no bypass was attempted." >&2
            jq '{message:.message,sha:.sha}' <<<"$RESULT" >&2
            exit 1
          }
          MERGED_SHA="$(jq -r '.sha' <<<"$RESULT")"
          gh api "repos/$REPO/pulls/$PR_NUMBER" > /tmp/merged-pr.json
          test "$(jq -r '.merged_at != null' /tmp/merged-pr.json)" = "true"
          test "$(jq -r '.merge_commit_sha' /tmp/merged-pr.json)" = "$MERGED_SHA"
          echo "Protected merge verified at $MERGED_SHA. App-authenticated merge will trigger main push verification."

  advance-beta-queue:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request_target' &&
       ((github.event.action == 'closed' &&
         github.event.pull_request.merged == false) ||
        github.event.action == 'converted_to_draft'))
    runs-on: ubuntu-latest
    concurrency:
      group: beta-release-queue-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
    env:
      REPO: ${{ github.repository }}
      PACKAGE_BOT_LOGIN: ${{ vars.MOONDOG_RELEASE_APP_LOGIN }}
    steps:
      - name: Check out trusted queue policy from main
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - name: Select next authorized runtime PR without write credentials
        id: candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPO/pulls?state=open&per_page=100" --jq '.[]' | jq -s '.' > /tmp/open-prs.json
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          from scripts.beta_release_queue import select_next_runtime_pr
          from scripts.guarded_merge_policy import load_policy

          prs = json.load(open("/tmp/open-prs.json", encoding="utf-8"))
          paths_by_pr = {}
          for pr in prs:
              if pr.get("state") != "open" or pr.get("draft") is not False:
                  continue
              number = pr.get("number")
              if not isinstance(number, int):
                  continue
              result = subprocess.run(
                  ["gh", "api", "--paginate",
                   f"repos/{os.environ['REPO']}/pulls/{number}/files?per_page=100",
                   "--jq", ".[] | .filename, (.previous_filename // empty)"],
                  check=True, capture_output=True, text=True,
              )
              paths_by_pr[number] = [line for line in result.stdout.splitlines() if line]

          candidate = select_next_runtime_pr(
              prs,
              paths_by_pr,
              repository=os.environ["REPO"],
              package_bot_login=os.environ.get("PACKAGE_BOT_LOGIN"),
              policy=load_policy(".github/guarded-merge-policy.json"),
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              if candidate is None:
                  print("No authorized runtime PR is queued for Beta packaging.")
                  output.write("has_candidate=false\n")
                  raise SystemExit(0)
              number = candidate["number"]
              expected_head = candidate["head"]["sha"]
              if not isinstance(number, int) or not re.fullmatch(r"[0-9a-f]{40}", str(expected_head)):
                  raise SystemExit("Queue candidate returned an invalid PR number or head SHA.")
              main = subprocess.check_output(
                  ["gh", "api", f"repos/{os.environ['REPO']}/branches/main", "--jq", ".commit.sha"],
                  text=True,
              ).strip()
              compare = json.loads(subprocess.check_output(
                  ["gh", "api", f"repos/{os.environ['REPO']}/compare/{main}...{expected_head}"],
                  text=True,
              ))
              if compare.get("status") == "ahead" and compare.get("merge_base_commit", {}).get("sha") == main:
                  action = "mark"
              elif compare.get("status") in {"behind", "diverged"}:
                  action = "refresh"
              else:
                  raise SystemExit(f"Queue refused PR #{number}: unexpected compare state {compare.get('status')!r}.")
              output.write(f"has_candidate=true\nnumber={number}\nhead={expected_head}\nmain={main}\naction={action}\n")
          PY

      - name: Create scoped MoonDog release App token
        id: release-app
        if: steps.candidate.outputs.has_candidate == 'true'
        uses: actions/create-github-app-token@67018539274d69449ef7c02e8e71183d1719ab42
        with:
          app-id: ${{ secrets.MOONDOG_RELEASE_APP_ID }}
          private-key: ${{ secrets.MOONDOG_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Advance selected runtime PR with expected-head protection
        if: steps.candidate.outputs.has_candidate == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
          APP_SLUG: ${{ steps.release-app.outputs.app-slug }}
          PR_NUMBER: ${{ steps.candidate.outputs.number }}
          EXPECTED_HEAD: ${{ steps.candidate.outputs.head }}
          EXPECTED_MAIN: ${{ steps.candidate.outputs.main }}
          ACTION: ${{ steps.candidate.outputs.action }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          test "$PACKAGE_BOT_LOGIN" = "$APP_SLUG[bot]"
          gh api "repos/$REPO/pulls/$PR_NUMBER" > /tmp/candidate-pr.json
          if [ "$(jq -r '.state' /tmp/candidate-pr.json)" != "open" ] ||
             [ "$(jq -r '.draft' /tmp/candidate-pr.json)" != "false" ] ||
             [ "$(jq -r '.head.sha' /tmp/candidate-pr.json)" != "$EXPECTED_HEAD" ]; then
            echo "Queue candidate changed after selection; its PR event will recalculate the queue."
            exit 0
          fi
          CURRENT_MAIN="$(gh api "repos/$REPO/branches/main" --jq .commit.sha)"
          if [ "$CURRENT_MAIN" != "$EXPECTED_MAIN" ]; then
            echo "Main advanced after selection; its push event will recalculate the queue."
            exit 0
          fi
          if [ "$ACTION" = "mark" ]; then
            BODY="$(jq -r '.body // ""' /tmp/candidate-pr.json)"
            MARKER="<!-- moondog-beta-queue:$EXPECTED_MAIN:$GITHUB_RUN_ID -->"
            if [[ "$BODY" != *"$MARKER"* ]]; then
              UPDATED_BODY="$(python3 - "$BODY" "$MARKER" <<'PY'
          import re
          import sys
          body, marker = sys.argv[1], sys.argv[2]
          body = re.sub(r"(?m)^<!-- moondog-beta-queue:[^>]+ -->\s*\n?", "", body).rstrip()
          print((body + "\n\n" if body else "") + marker)
          PY
              )"
              gh api -X PATCH "repos/$REPO/pulls/$PR_NUMBER" -f body="$UPDATED_BODY" >/dev/null
            fi
            echo "Selected PR #$PR_NUMBER already includes current main; triggered its event-driven packaging check."
          elif [ "$ACTION" = "refresh" ]; then
            gh api -X PUT "repos/$REPO/pulls/$PR_NUMBER/update-branch" -f expected_head_sha="$EXPECTED_HEAD" >/dev/null
            REFRESHED_HEAD="$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq .head.sha)"
            test "$REFRESHED_HEAD" != "$EXPECTED_HEAD" || {
              echo "Queue refused PR #$PR_NUMBER: GitHub did not advance its head." >&2
              exit 1
            }
            echo "Additively advanced PR #$PR_NUMBER; synchronize starts fresh package checks."
          else
            echo "Unexpected selected queue action." >&2
            exit 1
          fi
