name: Build Beta 12 package
on:
  push:
    branches:
      - beta/manager-attention-button-reliability-20261010
permissions:
  contents: write
jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[beta12-package]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Build and commit Beta package
        run: |
          python3 scripts/build_beta12.py
          git add updates/manifest.json updates/packages/moondog-0.10.18-beta.12.json
          git -c user.name='MoonDog CI' -c user.email='ci@users.noreply.github.com' commit -m '[beta12-package] Release candidate'
          git push
