name: Publication check

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: publication-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-boundary:
    name: Current-tree and package privacy boundary
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Load privacy scanners from trusted base
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          trusted="${RUNNER_TEMP}/moondog-privacy"
          mkdir -p "$trusted"
          base="$PR_BASE_SHA"
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            base="$(git rev-parse HEAD^)"
          fi
          test -n "$base"
          for name in check_publication.py audit_git_history.py audit_public_git_history.py; do
            git show "$base:scripts/$name" > "$trusted/$name"
            test -s "$trusted/$name"
          done
          echo "MOONDOG_TRUSTED_PRIVACY=$trusted" >> "$GITHUB_ENV"
      - name: Verify tracked public data boundary and embedded package privacy
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import subprocess
          from pathlib import Path
          import sys
          sys.path.insert(0, os.environ["MOONDOG_TRUSTED_PRIVACY"])
          from check_publication import blocked_content, blocked_path

          root = Path.cwd()
          paths = subprocess.check_output(["git", "ls-files", "-z"]).split(bytes([0]))
          failures = 0
          for raw in filter(None, paths):
              path = os.fsdecode(raw)
              if blocked_path(path):
                  failures += 1
                  continue
              content = subprocess.check_output(["git", "show", ":" + path])
              if blocked_content(content):
                  failures += 1
              if path.startswith("updates/packages/") and path.endswith(".json"):
                  try:
                      package = json.loads(content)
                      for entry in package["files"]:
                          if blocked_path(entry["path"]) or blocked_content(
                              base64.b64decode(entry["contentBase64"], validate=True)
                          ):
                              failures += 1
                  except (KeyError, ValueError, TypeError):
                      failures += 1
          if failures:
              raise SystemExit(f"Privacy publication blocked: {failures} redacted finding(s)")
          print("Current tracked tree and embedded package privacy scan passed")
          PY

  history-boundary:
    name: Contextual history scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch all public refs for history audit
        run: git fetch --force --tags origin '+refs/heads/*:refs/remotes/origin/*'
      - name: Load privacy scanners from trusted base
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          trusted="${RUNNER_TEMP}/moondog-privacy"
          mkdir -p "$trusted"
          base="$PR_BASE_SHA"
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            base="$(git rev-parse HEAD^)"
          fi
          test -n "$base"
          for name in check_publication.py audit_git_history.py audit_public_git_history.py; do
            git show "$base:scripts/$name" > "$trusted/$name"
            test -s "$trusted/$name"
          done
          echo "MOONDOG_TRUSTED_PRIVACY=$trusted" >> "$GITHUB_ENV"
      - name: Audit reachable Git history for sensitive material
        env:
          TRUSTED_SCRIPT: audit_git_history.py
        run: |
          python3 - <<'PY'
          import os
          import sys
          from pathlib import Path
          trusted = Path(os.environ["MOONDOG_TRUSTED_PRIVACY"])
          sys.path.insert(0, str(trusted))
          name = os.environ["TRUSTED_SCRIPT"]
          source = (trusted / name).read_bytes()
          filename = str(Path.cwd() / "scripts" / name)
          exec(compile(source, filename, "exec"), {"__name__": "__main__", "__file__": filename})
          PY

  history-strict:
    name: Strict history scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch all public refs for history audit
        run: git fetch --force --tags origin '+refs/heads/*:refs/remotes/origin/*'
      - name: Load privacy scanners from trusted base
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          trusted="${RUNNER_TEMP}/moondog-privacy"
          mkdir -p "$trusted"
          base="$PR_BASE_SHA"
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            base="$(git rev-parse HEAD^)"
          fi
          test -n "$base"
          for name in check_publication.py audit_git_history.py audit_public_git_history.py; do
            git show "$base:scripts/$name" > "$trusted/$name"
            test -s "$trusted/$name"
          done
          echo "MOONDOG_TRUSTED_PRIVACY=$trusted" >> "$GITHUB_ENV"
      - name: Enforce strict redacted full-history VIN and credential scan
        env:
          TRUSTED_SCRIPT: audit_public_git_history.py
        run: |
          python3 - <<'PY'
          import os
          import sys
          from pathlib import Path
          trusted = Path(os.environ["MOONDOG_TRUSTED_PRIVACY"])
          sys.path.insert(0, str(trusted))
          name = os.environ["TRUSTED_SCRIPT"]
          source = (trusted / name).read_bytes()
          filename = str(Path.cwd() / "scripts" / name)
          exec(compile(source, filename, "exec"), {"__name__": "__main__", "__file__": filename})
          PY

  publication-check:
    name: Publication Check
    if: always()
    needs: [public-boundary, history-boundary, history-strict]
    runs-on: ubuntu-latest
    steps:
      - name: Require every privacy result
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          expected = {'public-boundary', 'history-boundary', 'history-strict'}
          if set(results) != expected or any(result.get('result') != 'success' for result in results.values()):
              raise SystemExit('Publication blocked: every required privacy job must succeed')
          print('All required current-tree, package and full-history privacy checks passed')
          PY
