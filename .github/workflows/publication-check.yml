name: Publication check

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '23 11 * * 1'

permissions:
  contents: read
  actions: read
  statuses: write

concurrency:
  group: publication-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-boundary:
    name: Publication Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fetch all public refs for history audit
        run: |
          git fetch --force --tags origin '+refs/heads/*:refs/remotes/origin/*'
      - name: Reject falsely attributed CI co-authors in new commits
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess

          base = os.environ.get("PR_BASE_SHA")
          head = os.environ.get("PR_HEAD_SHA")
          revision = f"{base}..{head}" if base and head else os.environ["GITHUB_SHA"]
          messages = subprocess.check_output(
              ["git", "log", "--format=%B%x00", revision], text=True
          )
          bad_ci_trailer = re.compile(
              r"(?im)^Co-authored-by:\s*[^\r\n]*<ci@users\.noreply\.github\.com>\s*$"
          )
          if bad_ci_trailer.search(messages):
              raise SystemExit(
                  "Incorrect CI co-author attribution. Remove the trailer; "
                  "MoonDog automation already uses github-actions[bot]."
              )
          PY
      - name: Run focused tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Verify updater-compatible generated runtime
        run: python3 scripts/build_operating_modules.py --check
      - name: Verify clean-install source contract
        run: python3 scripts/build_distribution.py --check-source
      - name: Test browser update check
        run: node --test tests/*.test.cjs
      - name: Check tracked publication contents
        run: python3 scripts/check_publication.py
      - name: Audit reachable Git history for sensitive material
        run: python3 scripts/audit_git_history.py

      # The guarded Beta packager issues the legacy required Publication Check
      # commit status for normal automated PRs. Trusted owner-authored bootstrap
      # PRs that change protected workflow/tests still need a legitimate route
      # to publish that status without relaxing branch protection.
      - name: Publish owner bootstrap status only after clean-install proof
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.author_association == 'OWNER' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.base.ref == 'main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Previous steps on this exact workflow run already passed. Wait for
          # the independent clean-install check on the same PR head.
          for attempt in {1..120}; do
            CHECKS="$(gh api "repos/$REPO/commits/$HEAD_SHA/check-runs?per_page=100")"
            CLEAN="$(jq -r '[.check_runs[] | select(.name=="prove-clean-install")] | sort_by(.completed_at // "") | last | .conclusion // ""' <<<"$CHECKS")"
            if [ "$CLEAN" = "success" ]; then
              gh api -X POST "repos/$REPO/statuses/$HEAD_SHA" \
                -f state=success \
                -f context="Publication Check" \
                -f description="Owner PR: verified exact-head Publication and Clean Install checks" \
                -f target_url="https://github.com/$REPO/actions/runs/$GITHUB_RUN_ID"
              exit 0
            fi
            if [[ "$CLEAN" =~ ^(failure|cancelled|timed_out|action_required)$ ]]; then
              echo "Clean Install Proof did not pass on the exact owner PR head." >&2
              exit 1
            fi
            sleep 5
          done
          echo "Timed out awaiting exact-head Clean Install Proof." >&2
          exit 1
