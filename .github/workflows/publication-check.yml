name: Publication check

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: publication-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-boundary:
    name: Current-tree and package privacy boundary
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tracked public data boundary and embedded package privacy
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import subprocess
          from pathlib import Path
          from scripts.check_publication import blocked_content, blocked_path

          root = Path.cwd()
          paths = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\\0")
          failures = 0
          for raw in filter(None, paths):
              path = os.fsdecode(raw)
              if blocked_path(path):
                  failures += 1
                  continue
              content = subprocess.check_output(["git", "show", ":" + path])
              if blocked_content(content):
                  failures += 1
              if path.startswith("updates/packages/") and path.endswith(".json"):
                  try:
                      package = json.loads(content)
                      for entry in package["files"]:
                          if blocked_path(entry["path"]) or blocked_content(
                              base64.b64decode(entry["contentBase64"], validate=True)
                          ):
                              failures += 1
                  except (KeyError, ValueError, TypeError):
                      failures += 1
          if failures:
              raise SystemExit(f"Privacy publication blocked: {failures} redacted finding(s)")
          print("Current tracked tree and embedded package privacy scan passed")
          PY

  history-boundary:
    name: Contextual history scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch all public refs for history audit
        run: git fetch --force --tags origin '+refs/heads/*:refs/remotes/origin/*'
      - name: Audit reachable Git history for sensitive material
        run: python3 scripts/audit_git_history.py

  history-strict:
    name: Strict history scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch all public refs for history audit
        run: git fetch --force --tags origin '+refs/heads/*:refs/remotes/origin/*'
      - name: Enforce strict redacted full-history VIN and credential scan
        run: python3 scripts/audit_public_git_history.py

  publication-check:
    name: Publication Check
    if: always()
    needs: [public-boundary, history-boundary, history-strict]
    runs-on: ubuntu-latest
    steps:
      - name: Require every privacy result
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          expected = {'public-boundary', 'history-boundary', 'history-strict'}
          if set(results) != expected or any(result.get('result') != 'success' for result in results.values()):
              raise SystemExit('Publication blocked: every required privacy job must succeed')
          print('All required current-tree, package and full-history privacy checks passed')
          PY
