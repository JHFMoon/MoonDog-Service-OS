name: Build Beta 14 package
on:
  push:
    branches:
      - beta/report-control-exact-ranges-20261010
permissions:
  contents: write
jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[beta14-package]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Build package
        run: |
          python3 scripts/build_beta14.py
          git add updates/manifest.json updates/packages/moondog-0.10.18-beta.14.json
          git -c user.name='MoonDog CI' -c user.email='ci@users.noreply.github.com' commit -m '[beta14-package] Complete release candidate'
          git push
